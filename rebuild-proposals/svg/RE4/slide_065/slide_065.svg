<title id="accessible_title">Viele Komponenten senken die Systemzuverlässigkeit</title><desc id="accessible_description">Bei einer Serienstruktur fällt die Systemzuverlässigkeit mit jeder zusätzlichen Komponente – besonders bei geringerer Einzelzuverlässigkeit.</desc>
<defs><marker id="arrow_142452" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#142452"/></marker></defs>
<style>text{font-family:"Archivo", Arial, Helvetica, sans-serif;letter-spacing:0}</style>
<g id="scene_content" data-qc-group="scene_content" data-qc-layer="content" data-source-ref="RE4::65"><path data-role="concept-panel" d="M120 159 H792 V205 L772 225 H112 V167 Q112 159 120 159Z" fill="#142452"/><text style="font-family:Oxanium, Archivo, Arial, sans-serif" x="136" y="203" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start" data-qc-role="text">Serienstruktur</text><text style="font-family:Oxanium, Archivo, Arial, sans-serif" x="112" y="329" font-size="42" font-weight="600" fill="#142452" text-anchor="start" data-qc-role="text">Mehr Bauteile,</text><text style="font-family:Oxanium, Archivo, Arial, sans-serif" x="112" y="385" font-size="38" font-weight="600" fill="#142452" text-anchor="start" data-qc-role="text">geringere Systemzuverlässigkeit</text><text x="112" y="472" font-size="30" font-weight="500" fill="#142452" text-anchor="start" data-qc-role="text">Mit jedem weiteren Bauteil wird</text><text x="112" y="516" font-size="30" font-weight="500" fill="#142452" text-anchor="start" data-qc-role="text">ein zusätzlicher Zuverlässigkeitswert</text><text x="112" y="560" font-size="30" font-weight="500" fill="#142452" text-anchor="start" data-qc-role="text">in das Produkt aufgenommen.</text><image href="formulas/identical-series.svg" x="132" y="627" width="600" height="96" preserveAspectRatio="xMidYMid meet" data-formula-asset="formulas/identical-series.svg" data-qc-role="formula" aria-label="R_S(t) gleich R_B(t) hoch n"/><text x="112" y="780" font-size="28" font-weight="500" fill="#142452" text-anchor="start" data-qc-role="text">Für unabhängige Bauteile mit gleicher</text><text x="112" y="821" font-size="28" font-weight="500" fill="#142452" text-anchor="start" data-qc-role="text">Bauteilzuverlässigkeit.</text><text x="112" y="909" font-size="29" font-weight="600" fill="#142452" text-anchor="start" data-qc-role="text">Je geringer die Bauteilzuverlässigkeit,</text><text x="112" y="949" font-size="29" font-weight="600" fill="#142452" text-anchor="start" data-qc-role="text">desto stärker der Abfall.</text><image href="plots/series-component-count.svg" x="960" y="143" width="848" height="842" preserveAspectRatio="xMidYMid meet" data-plot-asset="plots/series-component-count.svg" aria-label="Systemzuverlässigkeit über 0 bis 300 Komponenten; Bauteilzuverlässigkeiten 99,9, 99,5, 99 und 95 Prozent"/></g>
