vo, Arial, sans-serif" x="1320" y="793" font-size="32" font-weight="600" fill="#142452" text-anchor="start" data-qc-role="text">Im Fokus: Zahnräder</text><text x="1320" y="843" font-size="27" font-weight="500" fill="#142452" text-anchor="start" data-qc-role="text">Sie übertragen das Drehmoment</text><text x="1320" y="881" font-size="27" font-weight="500" fill="#142452" text-anchor="start" data-qc-role="text">im Getriebe. Ihre Funktion ist</text><text x="1320" y="919" font-size="27" font-weight="500" fill="#142452" text-anchor="start" data-qc-role="text">für das Getriebe erforderlich.</text></g></g>
