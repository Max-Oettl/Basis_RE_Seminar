2452" text-anchor="start" data-qc-role="text">Ein Ausfall verändert die anderen</text><text x="190" y="841" font-size="28" font-weight="500" fill="#142452" text-anchor="start" data-qc-role="text">Ausfallwahrscheinlichkeiten nicht.</text></g><g id="assumptions_no_coupling" data-anim-target="true" data-anim-label="Keine gemeinsamen Ursachen" data-qc-group="assumptions_no_coupling"><text x="190" y="903" font-size="27" font-weight="500" fill="#435075" text-anchor="start" data-qc-role="text">Keine gemeinsamen Ursachen,</text><text x="190" y="940" font-size="27" font-weight="500" fill="#435075" text-anchor="start" data-qc-role="text">Kopplungen oder Wechselwirkungen.</text></g><g id="assumptions_bridge" data-anim-target="true" data-anim-label="Komplexere Struktur als Anwendungsgrenze" data-qc-group="assumptions_bridge"><path data-role="concept-panel" d="M960 159 H1808 V205 L1788 225 H952 V167 Q952 159 960 159Z" fill="#142452"/><text style="font-family:Oxanium, Archivo, Arial, sans-serif" x="976" y="203" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start" data-qc-role="text">Brückenschaltung</text><path d="M1000 571 H1060 M1060 451 V691 M1060 451 H1090 M1060 691 H1090 M1218 451 H1550 M1218 691 H1550 M1678 451 H1740 M1678 691 H1740 M1740 451 V691 M1740 571 H1790" fill="none" stroke="#142452" stroke-width="2.5" stroke-linejoin="round" data-role="connector"/><circle cx="1000" cy="571" r="5" fill="#142452"/><text x="977" y="580" font-size="26" font-weight="650" fill="#142452" text-anchor="end" data-qc-role="text">E</text><circle cx="1790" cy="571" r="5" fill="#142452"/><text x="1813" y="580" font-size="26" font-weight="650" fill="#142452" text-anchor="start" data-qc-role="text">A</text><g data-component="1" data-from="E" data-to="upper"><g data-rbd-block="1" data-rbd-state="neutral"><rect x="1090" y="420" width="128" height="62" rx="8" fill="#FFFFFF" stroke="#142452" stroke-width="1.5"/><text x="1154" y="461" font-size="30" font-weight="600" fill="#142452" text