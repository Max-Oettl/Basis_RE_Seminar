<g id="scene_content" data-qc-group="scene_content" data-qc-layer="content" data-source-ref="RE3::23"><g id="surface_plot" data-anim-target="true" data-anim-label="Dichteverteilungen der Ausfallwahrscheinlichkeit über der Lebensdauer" data-qc-group="surface_plot"><rect x="92" y="180" width="1220" height="700" rx="14" fill="#FFFFFF" stroke="#D0D3DC" stroke-width="1.5" data-qc-allow-overlap="true"/><image href="../../../../analysis/re3-assets/plots/probability-surface.svg" x="112" y="198" width="1180" height="664" preserveAspectRatio="xMidYMid meet" aria-label="Dichteverteilungen der Ausfallwahrscheinlichkeit über der Lebensdauer" data-qc-allow-overlap="true"/></g><g id="surface_meaning" data-anim-target="true" data-anim-label="F(t) bleibt unsicher" data-qc-group="surface_meaning"><rect x="1352" y="220" width="476" height="252" rx="12" fill="#FFFFFF" stroke="#142452" stroke-width="1.8" data-qc-allow-overlap="true"/><text x="1380" y="260" font-size="18" font-weight="850" fill="#142452" text-anchor="start" data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" data-qc-padding="2">VERTEILUNG STATT EINZELWERT</text><text x="1380" y="304" font-size="25" font-weight="800" fill="#031334" text-anchor="start" data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" data-qc-padding="2"><tspan x="1380" dy="0">F(t) bleibt unsicher</tspan></text><text x="1380" y="362" font-size="20" font-weight="620" fill="#142452" text-anchor="start" data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" data-qc-padding="2"><tspan x="1380" dy="0">Für einen Zeitpunkt ergibt sich aus</tspan><tspan x="1380" dy="25.6">der Stichprobe eine Verteilung</tspan><tspan x="1380" dy="25.6">plausibler</tspan><tspan x="1380" dy="25.6">Ausfallwahrscheinlichkeiten.</tspan></text></g><g id="surface_message" data-anim-target="true" data-anim-label="Die Weibullgerade entsteht" data-qc-group="surface_message"><rect x="1352" y="508" width="476" height="270" rx="12" fill="#FFF