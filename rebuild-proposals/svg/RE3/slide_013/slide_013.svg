<g id="scene_content" data-qc-group="scene_content" data-qc-layer="content" data-source-ref="RE3::13"><g id="method_mls" data-anim-target="true" data-anim-label="Grafische Schätzung" data-qc-group="method_mls"><rect x="92" y="252" width="800" height="490" rx="12" fill="#FFFFFF" stroke="#142452" stroke-width="1.8" data-qc-allow-overlap="true"/><text x="120" y="292" font-size="18" font-weight="850" fill="#142452" text-anchor="start" data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" data-qc-padding="2">MLS · REGRESSION</text><text x="120" y="336" font-size="25" font-weight="800" fill="#031334" text-anchor="start" data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" data-qc-padding="2"><tspan x="120" dy="0">Grafische Schätzung</tspan></text><text x="120" y="394" font-size="20" font-weight="620" fill="#142452" text-anchor="start" data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" data-qc-padding="2"><tspan x="120" dy="0">Besonders anschaulich bei vollständigen Datensätzen. Fit-Gerade und</tspan><tspan x="120" dy="25.6">Parameter werden im Weibullnetz bestimmt.</tspan></text></g><g id="method_mle" data-anim-target="true" data-anim-label="Information vollständig nutzen" data-qc-group="method_mle"><rect x="928" y="252" width="900" height="490" rx="12" fill="#FFFFFF" stroke="#435075" stroke-width="1.8" data-qc-allow-overlap="true"/><text x="956" y="292" font-size="18" font-weight="850" fill="#435075" text-anchor="start" data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" data-qc-padding="2">MLE · LIKELIHOOD</text><text x="956" y="336" font-size="25" font-weight="800" fill="#031334" text-anchor="start" data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" data-qc-padding="2"><tspan x="956" dy="0">Information vollständig nutzen</tspan></text><text x="956" y="394" font-size="20" font-weight="620" fill="#142452" text-anchor="start" data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" data-qc-padding="2"><tspan x="956" dy="0">Bevorzugt bei zensierten Datensätzen, weil Ausfälle und</tspan><tspan x="956" dy="25.6">Zensierungsinformationen gemeinsam in die Schätzung eingehen.</tspan></text></g><g id="method_decision" data-anim-target="true" data-anim-label="Methodenwahl" data-qc-group="method_decision"><rect x="92" y="794" width="1736" height="126" rx="10" fill="#E8E9EE" stroke="#142452" stroke-width="1.8" data-qc-allow-overlap="true"/><text x="132" y="842" font-size="18" font-weight="850" fill="#142452" text-anchor="start" data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" data-qc-padding="2">ENTSCHEIDUNGSREGEL</text><text x="132" y="884" font-size="26" font-weight="780" fill="#031334" text-anchor="start" data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" data-qc-padding="2"><tspan x="132" dy="0">vollständig → MLS gut nachvollziehbar · zensiert → MLE bevorzugen</tspan></text></g></g>
