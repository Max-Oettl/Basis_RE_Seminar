  <title id="plot_title">Badewannenkurve mit drei Lebensphasen</title>
  <desc id="plot_description">Die Ausfallzahl fällt bei den Frühausfällen, bleibt im Bereich der Zufallsausfälle annähernd konstant und steigt bei den Ermüdungsausfällen wieder an.</desc>
