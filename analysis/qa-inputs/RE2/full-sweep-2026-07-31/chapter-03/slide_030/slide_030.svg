<g id="scene_content" data-qc-group="scene_content" data-qc-layer="content"><g data-source-evidence="source_slide" data-source-reference="Quellfolie 30: 2. Schritt: Definition der unerwünschten Ereignisse"><g id="fta30_preventive"><title>Präventiver Ansatz</title><rect data-qc-allow-overlap="true" x="92" y="214" width="808" height="608" rx="16" fill="#E6F6EE" stroke="#00A754" stroke-width="2.2"/>
     <text data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="496" y="274" font-size="31" font-weight="850" fill="#00A754" text-anchor="middle" data-qc-padding="0">PRÄVENTIV</text>
     <rect data-qc-allow-overlap="true" x="332" y="302" width="328" height="38" rx="19" fill="#FFFFFF" stroke="#00A754" stroke-width="1.4"/><text data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="496" y="328" font-size="18" font-weight="780" fill="#00A754" text-anchor="middle" data-qc-padding="0">PROAKTIV · VOR DEM AUFTRETEN</text>
     <text data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="134" y="410" font-size="23" font-weight="700" fill="#031334" text-anchor="start" data-qc-padding="0"><tspan data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="134" dy="0">• Fehlerquellen und Risiken frühzeitig identifizieren</tspan></text>
     <text data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="134" y="518" font-size="23" font-weight="700" fill="#031334" text-anchor="start" data-qc-padding="0"><tspan data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="134" dy="0">• Systemzuverlässigkeit und -sicherheit durch Beseitigung</tspan><tspan data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="134" dy="28">potenzieller Risiken verbessern</tspan></text>
     <text data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="134" y="670" font-size="23" font-weight="700" fill="#031334" text-anchor="start" data-qc-padding="0"><tspan data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="134" dy="0">• Spätere Korrekturmaßnahmen und Reparaturen reduzieren</tspan></text></g><g id="fta30_corrective"><title>Korrektiver Ansatz</title><rect data-qc-allow-overlap="true" x="1028" y="214" width="800" height="608" rx="16" fill="#FFF5CC" stroke="#E9B400" stroke-width="2.2"/>
     <text data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="1428" y="274" font-size="31" font-weight="850" fill="#E9B400" text-anchor="middle" data-qc-padding="0">KORREKTIV</text>
     <rect data-qc-allow-overlap="true" x="1254" y="302" width="348" height="38" rx="19" fill="#FFFFFF" stroke="#E9B400" stroke-width="1.4"/><text data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="1428" y="328" font-size="18" font-weight="780" fill="#E9B400" text-anchor="middle" data-qc-padding="0">REAKTIV · NACH DEM AUFTRETEN</text>
     <text data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="1070" y="410" font-size="23" font-weight="700" fill="#031334" text-anchor="start" data-qc-padding="0"><tspan data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="1070" dy="0">• Aufgetretene Fehler und Ursachen nach Vorfall oder</tspan><tspan data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="1070" dy="28">Systemausfall analysieren</tspan></text>
     <text data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="1070" y="550" font-size="23" font-weight="700" fill="#031334" text-anchor="start" data-qc-padding="0"><tspan data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="1070" dy="0">• Wartung und Reparatur durch gezielte Korrekturmaßnahmen</tspan><tspan data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="1070" dy="28">verbessern</tspan></text>
     <text data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="1070" y="690" font-size="23" font-weight="700" fill="#031334" text-anchor="start" data-qc-padding="0"><tspan data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="1070" dy="0">• Ähnliche Probleme künftig vermeiden</tspan></text></g><g id="fta30_comparison"><title>Zeitlicher Unterschied</title><rect data-qc-allow-overlap="true" x="244" y="856" width="1432" height="76" rx="9" fill="#031334" stroke="#031334" stroke-width="1.5"/>
     <text data-qc-role="text" data-qc-layer="text" data-qc-allow-overlap="true" x="960" y="905" font-size="22" font-weight="780" fill="#FFFFFF" text-anchor="middle" data-qc-padding="0">DESIGN &amp; ENTWICKLUNG  ←  PRÄVENTIV   |   KORREKTIV  →  BETRIEB &amp; VORFALL</text></g></g></g>
