<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-desc" data-artifact-scope="content-svg" data-role="content-root" data-qc-role="scene" data-qc-group="scene-content" data-qc-layer="content">
  <title id="scene-title">P-Diagramm des Wechselrichters</title>
  <desc id="scene-desc">Das P-Diagramm zeigt den Wechselrichter innerhalb einer Systemgrenze. Gleichstrom und Betätigungsenergie wirken über zwei getrennte linke Kanäle ein. Ein Signal wirkt von unten ein. Vibration, Schmutz, Wärme und Feuchtigkeit sind vier eigenständige Störgrößen. Wechselstrom verlässt das System als Ziel- und Ausgangsgröße.</desc>
