      <text id="formula_panel_label" class="text-primary" x="130" y="510" font-size="35" font-weight="750" data-qc-role="text" data-qc-group="formula_panel" data-qc-layer="foreground" data-qc-important="true">Berechnung mit:</text>
      <g id="median_rank_formula_asset" aria-label="F(t_i) = (i - 0,3) durch (n + 0,4)" transform="translate(184 648)" data-qc-role="formula" data-qc-group="formula_panel" data-qc-layer="foreground" data-qc-allow-overlap="true" data-formula-asset="assets/formulas/RE3_TEST_1/median_rank.svg" data-formula-embedding="inline">
        <text class="panel-text" x="0" y="28" font-size="38" font-style="italic" font-weight="520" data-qc-allow-overlap="true">F</text>
        <text class="panel-text" x="28" y="28" font-size="38" font-weight="520" data-qc-allow-overlap="true">(</text>
        <text class="panel-text" x="46" y="28" font-size="38" font-style="italic" font-weight="520" data-qc-allow-overlap="true">t</text>
        <text class="panel-text" x="62" y="40" font-size="22" font-style="italic" font-weight="520" data-qc-allow-overlap="true">i</text>
        <text class="panel-text" x="78" y="28" font-size="38" font-weight="520" data-qc-allow-overlap="true">) =</text>
        <text class="panel-text" x="244" y="2" text-anchor="middle" font-size="29" font-weight="520" data-qc-allow-overlap="true">i - 0,3</text>
        <line x1="178" y1="17" x2="310" y2="17" stroke="#062D46" stroke-width="2.4" data-qc-allow-overlap="true"/>
        <text class="panel-text" x="244" y="58" text-anchor="middle" font-size="29" font-weight="520" data-qc-allow-overlap="true">n + 0,4</text>
      </g>
      <text id="formula_range" class="panel-text" x="532" y="688" font-size="23" font-weight="520" data-qc-role="text" data-qc-group="formula_panel" data-qc-layer="foreground" data-qc-important="true">
        <tspan font-style="italic">i</tspan><tspan> = 1, 2, ..., </tspan><tspan font-style="italic">n</tspan>
      </text>
      <g id="formula_definitions" aria-label="Definitionen der Formelparameter">
        <text id="formula_definition_i" class="panel-text" x="182" y="782" font-size="30" font-style="italic" data-qc-role="text" data-qc-group="formula_panel" data-qc-layer="foreground" data-qc-important="true">i -> Rangnummer des Ausfalls</text>
