<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene_title scene_desc">
  <title id="scene_title">Ausfallwahrscheinlichkeiten berechnen</title>
  <desc id="scene_desc">Content-SVG ohne sichtbaren Folientitel: Die vorhandenen Ausfallzeiten bleiben auf der Lebensdauerachse, Schritt 1 ergänzt die Median-Rank-Formel und eine vertikale Konstruktionsachse.</desc>
