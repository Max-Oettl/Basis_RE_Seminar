  <title id="scene_title">Ausfallzeiten sammeln</title>
  <desc id="scene_desc">Content-SVG ohne sichtbaren Folientitel: Schritt 0 sammelt Ausfalldaten und zeigt sieben unregelmäßig verteilte Ausfallzeitpunkte auf einer Lebensdauerachse.</desc>
