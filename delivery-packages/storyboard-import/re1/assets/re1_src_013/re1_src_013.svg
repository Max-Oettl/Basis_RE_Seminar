  <title id="accessible_title">Definition Zuverlässigkeit</title>
  <desc id="accessible_description">Die Zuverlässigkeit ist die Wahrscheinlichkeit dafür, dass ein Produkt während einer definierten Zeitdauer unter gegebenen Funktions- und Umgebungsbedingungen nicht ausfällt.</desc>
