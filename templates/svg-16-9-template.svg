<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Reltest Academy SVG Template</title>
  <desc id="desc">16:9 template for Reltest Academy e-learning visuals.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { fill: #062d46; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 56px; font-weight: 700; }
      .label { fill: #062d46; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 30px; font-weight: 600; }
      .small { fill: #6a7a86; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 500; }
      .axis { stroke: #062d46; stroke-width: 4; stroke-linecap: round; }
      .grid { stroke: #eef3f6; stroke-width: 3; }
      .primary-line { fill: none; stroke: #139ccb; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .accent-fill { fill: #e7f6fb; }
    </style>
  </defs>

  <rect id="background" class="bg" width="1920" height="1080" />

  <g id="slide-content">
    <text id="slide-title" class="title" x="120" y="130">Slide Title</text>
  </g>
</svg>

