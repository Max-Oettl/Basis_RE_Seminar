<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><image width="218" height="76" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAANoAAABMAQMAAAAx7DvGAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAADUExURQAAAKd6PdoAAAABdFJOUwBA5thmAAAACXBIWXMAAA7DAAAOwwHHb6hkAAAAGUlEQVRIx2NgGAWjYBSMglEwCkbBKBg8AAAInAABKDIMAQAAAABJRU5ErkJggg==" preserveAspectRatio="none" id="img0"></image></defs><g><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(65.448 197)"></text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(101.448 197)">Der Median ist Ausfallzeit, bei der die eine Hälfte der Ausfälle früher und die andere später liegt</text><text font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(65.448 245)"></text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(101.448 245)">Er lässt sich mit der Ausfallwahrscheinlichkeit F(t) ermitteln:</text><text font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(65.448 485)"></text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(101.448 485)">In der Dichtefunktion f(t) teilt der Median die Fläche unter der Kurve in zwei exakt gleiche</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(101.448 517)">Hälften</text><text font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(65.448 565)"></text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(101.448 565)">Unempfindlich gegenüber „Ausreißern“</text><text font-family="Wingdings,Wingdings_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(575.615 565)"></text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(609.115 565)">extrem</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(697.781 565)">kurze oder lange Ausfallzeit hat keinen</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(101.448 597)">Einfluss auf den Median</text><text font-family="Aptos Display,Aptos Display_MSFontService,sans-serif" font-weight="400" font-size="53.3333" transform="translate(44.8084 72)">Median</text><use width="100%" height="100%" xlink:href="#img0" fill="none" transform="translate(531 314)"></use><path d="M530.5 313.5 749.5 313.5 749.5 390.5 530.5 390.5Z" stroke="#000000" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><text font-family="Cambria Math,Cambria Math_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(545.216 358)">𝐹</text><path d="M658.882 337.876C661.417 338.545 663.364 339.988 664.722 342.206 666.081 344.423 666.76 347.099 666.76 350.233 666.76 353.375 666.083 356.051 664.729 358.26 663.375 360.469 661.426 361.908 658.882 362.577L658.57 361.574C660.575 360.906 662.066 359.586 663.042 357.616 664.019 355.645 664.507 353.141 664.507 350.103 664.507 347.169 664.021 344.732 663.049 342.792 662.077 340.851 660.571 339.547 658.531 338.879ZM572.811 337.876 573.162 338.879C571.131 339.547 569.627 340.851 568.65 342.792 567.674 344.732 567.186 347.169 567.186 350.103 567.186 353.141 567.674 355.645 568.65 357.616 569.627 359.586 571.118 360.906 573.123 361.574L572.811 362.577C570.267 361.908 568.318 360.469 566.964 358.26 565.61 356.051 564.933 353.375 56