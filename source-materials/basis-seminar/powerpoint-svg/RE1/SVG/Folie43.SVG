<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><clipPath id="clip0"><rect x="0" y="0" width="1280" height="720"/></clipPath></defs><g clip-path="url(#clip0)"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(65.448 197)">Der meist kurz als Mittelwert bezeichnete empirische arithmetische Mittelwert wird aus den</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(65.448 229)">Ausfallzeiten</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="26.6667" transform="translate(224.115 229)">t</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="17.7778" transform="translate(231.448 235)">1</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(241.281 229)">,</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="26.6667" transform="translate(255.948 229)">t</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="17.7778" transform="translate(263.281 235)">2</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(273.115 229)">, ... ,</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="26.6667" transform="translate(331.781 229)">t</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="17.7778" transform="translate(339.115 235)">n</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(356.281 229)">folgendermaßen berechnet:</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(65.448 498)">Der Mittelwert gibt als Lageparameter an, wo ungefähr die Mitte der Ausfallzeiten liegt. Stellt man</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(65.448 530)">sich die Ausfallzeiten als Massenpunkte vor, so entspricht der Mittelwert</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="26.6667" transform="translate(918.335 530)">t</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="17.7778" transform="translate(925.668 536)">m</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(947.835 530)">dem Schwerpunkt</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(65.448 562)">dieser Massenpunkte.</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(65.448 624)">Der arithmetische Mittelwert ist sehr empfindlich gegenüber „Ausreißern“, d.h. eine extrem kurze</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(65.448 656)">oder lange Ausfallzeit beeinflusst die Größe des Mittelwertes sehr stark.</text><text font-family="Aptos Display,Aptos Display_MSFontService,sans-serif" font-weight="400" font-size="53.3333" transform="translate(44.8084 72)">Mittelwert</text><rect x="385.5" y="300.5" width="510" height="113" stroke="#000000" stroke-linejoin="round" stroke-miterlimit="10" fill="none"/><text font-family="Cambria Math,Cambria Math_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(429.722 365)">𝑡</text><text font-family="Cambria Math,Cambria Math_MSFontService