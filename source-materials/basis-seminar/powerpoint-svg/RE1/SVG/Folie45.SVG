<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><image width="218" height="76" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAANoAAABMAQMAAAAx7DvGAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAADUExURQAAAKd6PdoAAAABdFJOUwBA5thmAAAACXBIWXMAAA7DAAAOwwHHb6hkAAAAGUlEQVRIx2NgGAWjYBSMglEwCkbBKBg8AAAInAABKDIMAQAAAABJRU5ErkJggg==" preserveAspectRatio="none" id="img0"></image></defs><g><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text font-family="Aptos Display,Aptos Display_MSFontService,sans-serif" font-weight="400" font-size="53.3333" transform="translate(44.8084 72)">Median</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(50.3282 245)">Der Median ist diejenige Ausfallzeit, unterhalb und oberhalb derer genau die Hälfte der Ausfälle</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(50.3282 277)">liegen. Der Median lässt sich deshalb am einfachsten mit der Ausfallwahrscheinlichkeit</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="26.6667" transform="translate(1078.69 277)">F</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(1095.02 277)">(</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="26.6667" transform="translate(1103.85 277)">t</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(1111.19 277)">) ermitteln:</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(50.3282 517)">Wird das Ausfallverhalten mit der Dichtefunktion</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="26.6667" transform="translate(623.522 517)">f</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(630.855 517)">(</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="26.6667" transform="translate(639.688 517)">t</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(647.022 517)">) dargestellt, so unterteilt der Median die Fläche</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(50.3282 549)">unterhalb der Kurve</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="26.6667" transform="translate(291.662 549)">f</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(298.995 549)">(</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="26.6667" transform="translate(307.828 549)">t</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(315.162 549)">) in zwei gleich große Flächenstücke.</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(50.3282 597)">Ein großer Vorteil des Median im Vergleich zum Mittelwert</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="26.6667" transform="translate(740.548 597)">t</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="17.7778" transform="translate(747.882 603)">m</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(770.048 597)">besteht darin, dass er sehr</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(50.3282 629)">unempfindlich gegenüber „Ausreißern“ ist. Eine sehr kurze oder sehr lange Ausfallzeit kann den</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(50.3282 661)">Median nicht verschieben.</text><use width="100%" height="100%" xlink:href="#img0" fill="none" transform="translate(531 337)"></use><path d="M530.5 336.5 749.5 336.5 749.5 413.5 530.5 413.5Z" stroke="#000000" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><text font-family="Cambria Math,Cambria Math_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(545.216 381)">𝐹</text><path d="M658.882 360.916C661.417 361.585 663.364 363.028 664.722 365.246 666.081 367.463 666.76 370.139 666.76 373.273 666.76 376.415 666.083 379.091 664.729 381.3 663.375 383.509 661.426 384.948 658.882 385.617L658.57 384.614C660.575 383.946 662.066 382.626 663.042 380.656 664.019 378.685 664.507 376.181 664.507 373.143 664.507 370.209 664.021 367.772 663.049 365.832 662.077 363.891 660.571 362.587 658.531 361.919ZM572.811 360.916 573.162 361.919C571.131 362.587 569.627 363.891 568.65 365.832 567.674 367.772 567.186 370.209 567.186 373.143 567.186 376.181 567.674 378.685 568.65 380.656 569.627 382.626 571.118 383.946 573.123 384.614L572.811 385.617C570.267 384.948 568.318 383.509 566.964 381.3 565.61 379.091 564.933 376.415 564.933 373.273 564.933 370.139 565.612 367.463 566.971 365.246 568.329 363.028 570.276 361.585 572.811 360.916Z" fill-rule="evenodd"/><text font-family="Cambria Math,Cambria Math_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(573.656 381)">𝑡</text><text font-family="Cambria Math,Cambria Math_MSFontService,sans-serif" font-weight="400" font-size="19.4667" transform="translate(583.763 386)">𝑚𝑒𝑑𝑖𝑎𝑛</text><text font-family="Cambria Math,Cambria Math_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(676.509 381)">=</text><text font-family="Cambria Math,Cambria Math_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(703.916 381)">0</text><text font-family="Cambria Math,Cambria Math_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(718.749 381)">,</text><text font-family="Cambria Math,Cambria Math_MSFontService,sans-serif" font-weight="400" font-size="26.6667" transform="translate(724.249 381)">5</text></g></svg>