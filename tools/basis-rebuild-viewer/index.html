<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basis Rebuild Viewer</title>
  <style>
    :root {
      color: #102734;
      background: #eef3f6;
      font-family: "Segoe UI", Arial, sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; }
    .app {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      height: 100vh;
    }
    .sidebar {
      display: grid;
      min-height: 0;
      grid-template-rows: auto minmax(0, 1fr);
      border-right: 1px solid #cad7df;
      background: #fff;
    }
    .sidebar-header {
      padding: 18px;
      border-bottom: 1px solid #d8e3ea;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 23px;
      letter-spacing: 0;
    }
    .muted {
      color: #647987;
      font-size: 13px;
    }
    .filters {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 8px;
      margin-top: 14px;
    }
    .sidebar-actions {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }
    .sidebar-actions .button {
      width: 100%;
      font-weight: 800;
    }
    .slide-action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .slide-action-grid .wide {
      grid-column: 1 / -1;
    }
    .button.danger {
      border-color: #e2a2a2;
      color: #8c2424;
      background: #fff7f7;
    }
    .button.danger:hover {
      border-color: #c74d4d;
      background: #fff0f0;
    }
    .sidebar-toggle {
      margin-top: 2px;
      font-weight: 700;
    }
    .sidebar-message {
      min-height: 16px;
      color: #647987;
      font-size: 12px;
      line-height: 1.3;
    }
    .search, .select, .textarea {
      width: 100%;
      border: 1px solid #c7d4dc;
      border-radius: 8px;
      color: #102734;
      background: #f8fbfc;
      outline: none;
    }
    .search, .select {
      height: 38px;
      padding: 8px 10px;
    }
    .search:focus, .select:focus, .textarea:focus {
      border-color: #168fbd;
      box-shadow: 0 0 0 3px rgba(22, 143, 189, 0.14);
    }
    .slide-list {
      min-height: 0;
      overflow: auto;
      padding: 10px;
    }
    .module-label {
      margin: 14px 8px 7px;
      color: #6f818c;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .slide-item {
      display: grid;
      width: 100%;
      gap: 6px;
      margin-bottom: 6px;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #102734;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .slide-item:hover { background: #eef8fb; }
    .slide-item.active {
      color: #fff;
      background: #102734;
    }
    .slide-item.hidden-slide {
      border-color: #e7b4b4;
      background: #fff7f7;
    }
    .slide-title {
      overflow: hidden;
      font-weight: 750;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .slide-meta {
      color: #6c7f8b;
      font-size: 12px;
    }
    .slide-item.active .slide-meta { color: #c9e7f1; }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 2px 7px;
      border: 1px solid #d4dee5;
      border-radius: 999px;
      color: #536a78;
      background: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .slide-item.active .badge {
      border-color: rgba(255,255,255,0.35);
      color: #fff;
      background: rgba(255,255,255,0.12);
    }
    .badge.ok { border-color: #8fd8ab; color: #176b38; background: #e7f8ed; }
    .badge.warn { border-color: #f2cd6b; color: #7a4a00; background: #fff6d7; }
    .badge.miss { border-color: #e6a0a0; color: #8c2424; background: #fff0f0; }
    .main {
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: auto auto minmax(0, 1fr);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 12px 16px;
      border-bottom: 1px solid #cad7df;
      background: #fff;
    }
    .toolbar-title {
      min-width: 0;
      flex: 1;
    }
    .toolbar-title strong,
    .toolbar-title span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toolbar-title span {
      margin-top: 2px;
      color: #647987;
      font-size: 12px;
    }
    .button {
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid #c7d4dc;
      border-radius: 8px;
      color: #102734;
      background: #fff;
      cursor: pointer;
      text-decoration: none;
    }
    .button:hover {
      border-color: #168fbd;
      background: #eef8fb;
    }
    .button:disabled {
      cursor: default;
      opacity: 0.45;
    }
    .animation-bar {
      display: grid;
      grid-template-columns: auto auto auto auto 120px auto minmax(180px, 1fr) auto minmax(220px, 1fr);
      gap: 10px;
      align-items: center;
      min-width: 0;
      padding: 10px 16px;
      border-bottom: 1px solid #cad7df;
      background: #f8fafc;
    }
    .animation-bar strong {
      font-size: 13px;
    }
    .animation-status {
      min-width: 0;
      overflow: hidden;
      color: #647987;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .animation-timeline {
      width: 100%;
      margin: 0;
      accent-color: #168fbd;
    }
    .timeline-time {
      min-width: 42px;
      color: #647987;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .content {
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-columns: minmax(0, 1fr) 380px;
    }
    .compare {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 18px;
      background: #e7eef2;
    }
    .compare-grid {
      display: grid;
      min-height: 100%;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
    }
    .frame {
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: auto minmax(0, 1fr);
      border: 1px solid #cad7df;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .frame-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 42px;
      padding: 9px 11px;
      border-bottom: 1px solid #d8e3ea;
      color: #324e5e;
      font-size: 13px;
      font-weight: 800;
    }
    .frame-body {
      display: flex;
      min-height: 420px;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 12px;
      background:
        linear-gradient(45deg, #edf2f5 25%, transparent 25%),
        linear-gradient(-45deg, #edf2f5 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #edf2f5 75%),
        linear-gradient(-45deg, transparent 75%, #edf2f5 75%);
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
    }
    .media {
      display: block;
      max-width: 100%;
      max-height: 78vh;
      background: #fff;
      box-shadow: 0 8px 22px rgba(16, 39, 52, 0.13);
    }
    .inline-svg {
      display: block;
      max-width: 100%;
      max-height: 78vh;
      width: auto;
      height: auto;
      background: #fff;
      box-shadow: 0 8px 22px rgba(16, 39, 52, 0.13);
    }
    .inline-svg.width { width: 100%; max-height: none; }
    .inline-svg.original { max-width: none; max-height: none; }
    .media.width { width: 100%; max-height: none; }
    .media.original { max-width: none; max-height: none; }
    .empty {
      max-width: 360px;
      padding: 20px;
      color: #607481;
      text-align: center;
      line-height: 1.4;
    }
    .details {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      border-left: 1px solid #cad7df;
      background: #fff;
    }
    .section {
      padding: 16px;
      border-bottom: 1px solid #e1e9ee;
    }
    .section h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }
    .kv {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 6px 10px;
      font-size: 13px;
    }
    .kv dt {
      color: #647987;
      font-weight: 750;
    }
    .kv dd {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
      line-height: 1.38;
    }
    .list li {
      padding: 8px 9px;
      border-left: 3px solid #168fbd;
      background: #f4f8fa;
    }
    .list.warn li { border-left-color: #d89b19; background: #fff8df; }
    .list.issue li { border-left-color: #c74d4d; background: #fff1f1; }
    .textarea {
      min-height: 120px;
      resize: vertical;
      padding: 10px;
      line-height: 1.35;
    }
    .review-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
    }
    .presentation-toggle {
      display: grid;
      gap: 6px;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #dbe6ec;
      border-radius: 8px;
      background: #f7fafc;
    }
    .checkbox-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      color: #18394c;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }
    .checkbox-row input {
      width: 16px;
      height: 16px;
      margin: 1px 0 0;
      accent-color: #168fbd;
    }
    .checkbox-row:has(input:disabled) {
      color: #8295a0;
    }
    .review-status {
      margin-top: 8px;
      color: #647987;
      font-size: 12px;
    }
    .version-control {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .version-control .select:disabled {
      opacity: 0.65;
    }
    .global-crosscheck-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .global-crosscheck-controls .select { width: 190px; }
    .global-crosscheck-controls .button { font-weight: 800; }
    .global-crosscheck-backdrop {
      position: fixed;
      z-index: 70;
      inset: 0;
      display: flex;
      justify-content: flex-end;
      padding: 64px 18px 18px;
      background: rgba(7, 25, 35, 0.46);
    }
    .global-crosscheck-panel {
      display: grid;
      width: min(680px, calc(100vw - 36px));
      max-height: calc(100vh - 82px);
      grid-template-rows: auto auto minmax(0, 1fr);
      border: 1px solid #b9cbd5;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(7, 25, 35, 0.28);
      overflow: hidden;
    }
    .global-crosscheck-header {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #d8e3ea;
    }
    .global-crosscheck-header h2 {
      min-width: 0;
      flex: 1;
      margin: 0;
      font-size: 18px;
    }
    .global-crosscheck-summary {
      padding: 12px 16px;
      border-bottom: 1px solid #e1e9ee;
      color: #526b79;
      font-size: 13px;
      line-height: 1.45;
    }
    .global-crosscheck-results {
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }
    .global-crosscheck-result {
      display: grid;
      gap: 7px;
      margin-bottom: 8px;
      padding: 11px 12px;
      border: 1px solid #d8e3ea;
      border-radius: 8px;
      background: #fff;
    }
    .global-crosscheck-result-header {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .global-crosscheck-result-title {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      font-size: 13px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .global-crosscheck-result-meta {
      color: #647987;
      font-size: 12px;
    }
    .global-crosscheck-findings {
      display: grid;
      gap: 5px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 12px;
      line-height: 1.4;
    }
    .global-crosscheck-findings li {
      padding: 7px 8px;
      border-left: 3px solid #8da6b4;
      background: #f5f8fa;
    }
    .global-crosscheck-findings li[data-severity="warning"] {
      border-left-color: #d89b19;
      background: #fff8df;
    }
    .global-crosscheck-findings li[data-severity="error"] {
      border-left-color: #c74d4d;
      background: #fff1f1;
    }
    .crosscheck-status {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      padding: 3px 8px;
      border: 1px solid #b9cbd5;
      border-radius: 999px;
      color: #3e5a69;
      background: #f4f8fa;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .crosscheck-status.ok { border-color: #8fd8ab; color: #176b38; background: #e7f8ed; }
    .crosscheck-status.warn { border-color: #f2cd6b; color: #7a4a00; background: #fff6d7; }
    .crosscheck-status.error { border-color: #e6a0a0; color: #8c2424; background: #fff0f0; }
    .path-link {
      color: #116f91;
      text-decoration: none;
    }
    .path-link:hover { text-decoration: underline; }
    .frame-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .link-button {
      border: 0;
      padding: 0;
      color: #116f91;
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }
    .link-button:hover { text-decoration: underline; }
    .link-button:disabled {
      color: #9aabb5;
      cursor: default;
      text-decoration: none;
    }
    .fullscreen-viewer {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: #071923;
    }
    .fullscreen-viewer[hidden] { display: none !important; }
    .fullscreen-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      min-width: 0;
      padding: 12px 16px;
      color: #eaf6fb;
      background: #102734;
      border-bottom: 1px solid rgba(255,255,255,0.16);
    }
    .fullscreen-title {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
    }
    .fullscreen-toolbar .button,
    .fullscreen-toolbar .select {
      color: #102734;
      background: #fff;
    }
    .fullscreen-toolbar .timeline-time,
    .fullscreen-toolbar .animation-status,
    .fullscreen-toolbar .muted {
      color: #c8dbe5;
    }
    .fullscreen-toolbar .animation-status {
      flex: 1 1 220px;
    }
    .fullscreen-toolbar .animation-timeline {
      width: min(28vw, 340px);
    }
    .fullscreen-counter {
      min-width: 72px;
      color: #c8dbe5;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .fullscreen-presentation-control { display: none; }
    .fullscreen-viewer.presentation .fullscreen-presentation-control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .fullscreen-stage {
      display: flex;
      min-width: 0;
      min-height: 0;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    .fullscreen-canvas {
      display: flex;
      width: min(100%, calc((100vh - 112px) * 16 / 9));
      aspect-ratio: 16 / 9;
      align-items: center;
      justify-content: center;
      background: #fff;
      box-shadow: 0 18px 50px rgba(0,0,0,0.42);
    }
    .fullscreen-canvas .inline-svg {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      box-shadow: none;
    }
    .undo-toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 80;
      display: flex;
      max-width: min(420px, calc(100vw - 36px));
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid #c7d4dc;
      border-radius: 8px;
      color: #102734;
      background: #fff;
      box-shadow: 0 12px 34px rgba(16, 39, 52, 0.22);
      font-size: 13px;
      font-weight: 800;
    }
    .undo-toast[hidden] { display: none !important; }
    .undo-toast-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .undo-toast .button {
      min-height: 32px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Basis Rebuild</h1>
        <div id="count" class="muted">Laedt Quellen...</div>
        <div class="filters">
          <input id="search" class="search" type="search" placeholder="Folie, Modul oder Text suchen">
          <select id="moduleFilter" class="select" aria-label="Modulfilter"></select>
        </div>
        <div class="sidebar-actions">
          <button id="addSlide" class="button" type="button">Zusatzfolie hinzufuegen</button>
          <div class="slide-action-grid">
            <button id="moveSlideUp" class="button" type="button">Hoch</button>
            <button id="moveSlideDown" class="button" type="button">Runter</button>
            <button id="deleteSlide" class="button danger wide" type="button">Folie loeschen</button>
          </div>
          <label class="checkbox-row sidebar-toggle" for="showHiddenSlides">
            <input id="showHiddenSlides" type="checkbox">
            <span>Ausgeblendete anzeigen</span>
          </label>
          <div id="sidebarMessage" class="sidebar-message"></div>
        </div>
      </div>
      <div id="slideList" class="slide-list"></div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <button id="previous" class="button" title="Vorherige Folie">‹</button>
        <button id="next" class="button" title="Naechste Folie">›</button>
        <div class="toolbar-title">
          <strong id="title">Keine Folie ausgewaehlt</strong>
          <span id="subtitle"></span>
        </div>
        <select id="fitMode" class="select" aria-label="Einpassung">
          <option value="fit">Einpassen</option>
          <option value="width">Breite</option>
          <option value="original">Original</option>
        </select>
        <div class="global-crosscheck-controls">
          <select id="crosscheckScope" class="select" aria-label="Crosscheck-Bereich"></select>
          <button id="runCrosscheck" class="button" type="button">Crosscheck</button>
        </div>
        <button id="presentationMode" class="button" type="button" disabled>Praesentieren</button>
        <button id="refresh" class="button">Aktualisieren</button>
      </div>

      <div id="animationBar" class="animation-bar" hidden>
        <strong>Animation</strong>
        <button id="animationPlay" class="button" type="button">Abspielen</button>
        <button id="animationReset" class="button" type="button">Zuruecksetzen</button>
        <label class="muted" for="animationDelay">Schrittpause</label>
        <select id="animationDelay" class="select" aria-label="Pause zwischen Animationsschritten">
          <option value="500">0,5 s</option>
          <option value="1000">1,0 s</option>
          <option value="1500">1,5 s</option>
          <option value="2500" selected>2,5 s</option>
        </select>
        <span id="animationCurrent" class="timeline-time">0:00</span>
        <input id="animationTimeline" class="animation-timeline" type="range" min="0" max="1" value="0" step="1" aria-label="Animationszeit">
        <span id="animationTotal" class="timeline-time">0:00</span>
        <span id="animationStatus" class="animation-status">Keine Animation fuer diesen SVG-Vorschlag.</span>
      </div>

      <div class="content">
        <section id="compare" class="compare">
          <div class="compare-grid">
            <div class="frame">
              <div class="frame-header">
                <span>Referenzfolie</span>
                <a id="oldOpen" class="path-link" target="_blank" rel="noreferrer">oeffnen</a>
              </div>
              <div id="oldFrame" class="frame-body"></div>
            </div>
            <div class="frame">
              <div class="frame-header">
                <span>Neuer SVG-Vorschlag</span>
                <div class="frame-actions">
                  <button id="svgAnimationEdit" class="link-button" type="button" disabled>Animation bearbeiten</button>
                  <button id="svgFullscreen" class="link-button" type="button">Vollbild</button>
                  <a id="svgOpen" class="path-link" target="_blank" rel="noreferrer">oeffnen</a>
                </div>
              </div>
              <div id="svgFrame" class="frame-body"></div>
            </div>
          </div>
        </section>

        <aside class="details">
          <section class="section">
            <h2>Status</h2>
            <dl id="meta" class="kv"></dl>
          </section>
          <section class="section">
            <h2>Review</h2>
            <div class="review-grid">
              <select id="reviewStatus" class="select">
                <option value="open">offen</option>
                <option value="needs_revision">Korrektur</option>
                <option value="accepted">akzeptiert</option>
                <option value="final">final</option>
              </select>
              <button id="saveReview" class="button">Speichern</button>
            </div>
            <textarea id="reviewNotes" class="textarea" placeholder="Notizen zum Abgleich zwischen alter Folie und SVG-Vorschlag"></textarea>
            <div class="presentation-toggle">
              <label class="checkbox-row" for="includeInPresentation">
                <input id="includeInPresentation" type="checkbox">
                <span>Im Praesentationsmodus anzeigen</span>
              </label>
              <div id="presentationMessage" class="review-status"></div>
            </div>
            <div class="version-control">
              <label class="muted" for="versionSelect">Version anzeigen</label>
              <select id="versionSelect" class="select" aria-label="SVG-Version"></select>
              <div id="versionMessage" class="review-status"></div>
            </div>
            <div id="reviewMessage" class="review-status"></div>
          </section>
        </aside>
      </div>
    </main>
  </div>

  <div id="undoToast" class="undo-toast" hidden role="status" aria-live="polite">
    <span id="undoToastText" class="undo-toast-text">L&ouml;schen r&uuml;ckg&auml;ngig machen?</span>
    <button id="undoDelete" class="button" type="button">R&uuml;ckg&auml;ngig</button>
  </div>

  <div id="globalCrosscheckBackdrop" class="global-crosscheck-backdrop" hidden>
    <section class="global-crosscheck-panel" role="dialog" aria-modal="true" aria-labelledby="globalCrosscheckTitle">
      <div class="global-crosscheck-header">
        <h2 id="globalCrosscheckTitle">Crosscheck</h2>
        <button id="closeCrosscheck" class="button" type="button">Schliessen</button>
      </div>
      <div id="crosscheckProgress" class="global-crosscheck-summary" role="status" aria-live="polite"></div>
      <div id="crosscheckResults" class="global-crosscheck-results"></div>
    </section>
  </div>

  <div id="fullscreenViewer" class="fullscreen-viewer" hidden>
    <div class="fullscreen-toolbar">
      <div id="fullscreenTitle" class="fullscreen-title">SVG-Vorschlag</div>
      <button id="fullscreenPreviousSlide" class="button fullscreen-presentation-control" type="button">&lsaquo;</button>
      <span id="fullscreenCounter" class="fullscreen-counter fullscreen-presentation-control">0 / 0</span>
      <button id="fullscreenNextSlide" class="button fullscreen-presentation-control" type="button">&rsaquo;</button>
      <button id="fullscreenPlay" class="button fullscreen-animation-control" type="button">Abspielen</button>
      <button id="fullscreenReset" class="button fullscreen-animation-control" type="button">Zuruecksetzen</button>
      <label class="muted fullscreen-animation-control" for="fullscreenDelay">Schrittpause</label>
      <select id="fullscreenDelay" class="select fullscreen-animation-control" aria-label="Pause zwischen Animationsschritten im Vollbild">
        <option value="500">0,5 s</option>
        <option value="1000">1,0 s</option>
        <option value="1500">1,5 s</option>
        <option value="2500" selected>2,5 s</option>
      </select>
      <span id="fullscreenCurrent" class="timeline-time fullscreen-animation-control">0:00</span>
      <input id="fullscreenTimeline" class="animation-timeline fullscreen-animation-control" type="range" min="0" max="1" value="0" step="1" aria-label="Animationszeit im Vollbild">
      <span id="fullscreenTotal" class="timeline-time fullscreen-animation-control">0:00</span>
      <button id="fullscreenClose" class="button" type="button">Schliessen</button>
      <span id="fullscreenStatus" class="animation-status">Keine Animation fuer diesen SVG-Vorschlag.</span>
    </div>
    <div class="fullscreen-stage">
      <div id="fullscreenSvgFrame" class="fullscreen-canvas"></div>
    </div>
  </div>

  <script>
    const state = {
      slides: [],
      filtered: [],
      modules: [],
      selectedId: "",
      selectedVersionId: "current",
      showHidden: false,
      fit: "fit",
      renderToken: 0,
      previewSvg: null,
      animationManifest: null,
      animationSvg: null,
      animationTimeline: [],
      animationTime: 0,
      animationDuration: 0,
      animationPlaying: false,
      animationPaused: false,
      animationFrame: 0,
      animationLastTimestamp: 0,
      animationPauseMs: 2500,
      animationPauseUserSelected: false,
      originalTargetStyles: new Map(),
      fullscreenOpen: false,
      fullscreenMode: "single",
      fullscreenPlaceholder: null,
      presentationSlides: [],
      presentationIndex: 0,
      presentationToken: 0,
      pendingDeleteUndo: null,
      deleteUndoTimer: 0,
      crosscheckRunning: false,
      crosscheckResults: [],
    };

    const elements = {
      count: document.getElementById("count"),
      search: document.getElementById("search"),
      moduleFilter: document.getElementById("moduleFilter"),
      addSlide: document.getElementById("addSlide"),
      moveSlideUp: document.getElementById("moveSlideUp"),
      moveSlideDown: document.getElementById("moveSlideDown"),
      deleteSlide: document.getElementById("deleteSlide"),
      showHiddenSlides: document.getElementById("showHiddenSlides"),
      sidebarMessage: document.getElementById("sidebarMessage"),
      undoToast: document.getElementById("undoToast"),
      undoToastText: document.getElementById("undoToastText"),
      undoDelete: document.getElementById("undoDelete"),
      slideList: document.getElementById("slideList"),
      previous: document.getElementById("previous"),
      next: document.getElementById("next"),
      title: document.getElementById("title"),
      subtitle: document.getElementById("subtitle"),
      oldFrame: document.getElementById("oldFrame"),
      svgFrame: document.getElementById("svgFrame"),
      oldOpen: document.getElementById("oldOpen"),
      svgOpen: document.getElementById("svgOpen"),
      svgAnimationEdit: document.getElementById("svgAnimationEdit"),
      svgFullscreen: document.getElementById("svgFullscreen"),
      fitMode: document.getElementById("fitMode"),
      presentationMode: document.getElementById("presentationMode"),
      refresh: document.getElementById("refresh"),
      animationBar: document.getElementById("animationBar"),
      animationPlay: document.getElementById("animationPlay"),
      animationReset: document.getElementById("animationReset"),
      animationDelay: document.getElementById("animationDelay"),
      animationTimeline: document.getElementById("animationTimeline"),
      animationCurrent: document.getElementById("animationCurrent"),
      animationTotal: document.getElementById("animationTotal"),
      animationStatus: document.getElementById("animationStatus"),
      fullscreenViewer: document.getElementById("fullscreenViewer"),
      fullscreenTitle: document.getElementById("fullscreenTitle"),
      fullscreenSvgFrame: document.getElementById("fullscreenSvgFrame"),
      fullscreenPlay: document.getElementById("fullscreenPlay"),
      fullscreenReset: document.getElementById("fullscreenReset"),
      fullscreenDelay: document.getElementById("fullscreenDelay"),
      fullscreenTimeline: document.getElementById("fullscreenTimeline"),
      fullscreenCurrent: document.getElementById("fullscreenCurrent"),
      fullscreenTotal: document.getElementById("fullscreenTotal"),
      fullscreenStatus: document.getElementById("fullscreenStatus"),
      fullscreenClose: document.getElementById("fullscreenClose"),
      fullscreenPreviousSlide: document.getElementById("fullscreenPreviousSlide"),
      fullscreenNextSlide: document.getElementById("fullscreenNextSlide"),
      fullscreenCounter: document.getElementById("fullscreenCounter"),
      meta: document.getElementById("meta"),
      crosscheckScope: document.getElementById("crosscheckScope"),
      runCrosscheck: document.getElementById("runCrosscheck"),
      globalCrosscheckBackdrop: document.getElementById("globalCrosscheckBackdrop"),
      closeCrosscheck: document.getElementById("closeCrosscheck"),
      crosscheckProgress: document.getElementById("crosscheckProgress"),
      crosscheckResults: document.getElementById("crosscheckResults"),
      reviewStatus: document.getElementById("reviewStatus"),
      reviewNotes: document.getElementById("reviewNotes"),
      includeInPresentation: document.getElementById("includeInPresentation"),
      presentationMessage: document.getElementById("presentationMessage"),
      versionSelect: document.getElementById("versionSelect"),
      versionMessage: document.getElementById("versionMessage"),
      saveReview: document.getElementById("saveReview"),
      reviewMessage: document.getElementById("reviewMessage"),
    };

    function selectedSlide() {
      return state.slides.find((slide) => slide.id === state.selectedId) || null;
    }

    function selectedIndex() {
      return state.filtered.findIndex((slide) => slide.id === state.selectedId);
    }

    function selectedArchivedVersion(slide) {
      if (!slide || state.selectedVersionId === "current") return null;
      const versions = Array.isArray(slide.review?.versions) ? slide.review.versions : [];
      return versions.find((version) => version.version_id === state.selectedVersionId) || null;
    }

    function activeSvgProposal(slide) {
      return selectedArchivedVersion(slide)?.proposal || slide?.svgProposal || null;
    }

    function activeVersionLabel(slide) {
      return selectedArchivedVersion(slide)?.label || "Aktuelle Version";
    }

    function slideIncludedInPresentation(slide) {
      return slide?.review?.include_in_presentation !== false;
    }

    function slideIsHidden(slide) {
      return slide?.isHidden === true || slide?.status?.isHidden === true;
    }

    function slideDisplayLabel(slide) {
      if (slide?.isAdditionalSlide) {
        return slide.additionalSlide?.title || `Zusatzfolie ${String((slide.slideNumber || 1001) - 1000).padStart(3, "0")}`;
      }
      return `Folie ${String(slide?.slideNumber || 0).padStart(3, "0")}`;
    }

    function slideSubtitle(slide) {
      return `${slide.moduleId} · ${slide.slideId} · ${slideDisplayLabel(slide)}`;
    }

    function crosscheckReferences(slide) {
      return Array.isArray(slide?.crosscheck?.references) ? slide.crosscheck.references : [];
    }

    function primaryCrosscheckReference(slide) {
      const references = crosscheckReferences(slide);
      const preferred = Number(slide?.crosscheck?.referenceMapping?.primary_source_slide);
      return references.find((reference) => reference.sourceSlideNumber === preferred) || references[0] || null;
    }

    function crosscheckStatusInfo(status) {
      return {
        precheck_passed: { label: "Vorpruefung ohne Befund", tone: "ok" },
        review_required: { label: "Pruefung erforderlich", tone: "warn" },
        issues_found: { label: "Befunde gefunden", tone: "error" },
        not_applicable: { label: "Kein eigenes SVG", tone: "" },
        read_error: { label: "Bericht fehlerhaft", tone: "error" },
      }[status] || { label: "Noch nicht geprueft", tone: "" };
    }

    function renderCrosscheckScopeOptions() {
      const selected = selectedSlide();
      const previousValue = elements.crosscheckScope.value;
      elements.crosscheckScope.replaceChildren();

      const allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = "Alle Module";
      elements.crosscheckScope.append(allOption);

      state.modules.forEach((moduleId) => {
        const option = document.createElement("option");
        option.value = `module:${moduleId}`;
        option.textContent = `Modul: ${moduleId}`;
        elements.crosscheckScope.append(option);
      });

      if (selected) {
        const option = document.createElement("option");
        option.value = `slide:${selected.id}`;
        option.textContent = `Einzelne Folie: ${slideDisplayLabel(selected)}`;
        elements.crosscheckScope.append(option);
      }

      const availableValues = [...elements.crosscheckScope.options].map((option) => option.value);
      const requestedValue = previousValue.startsWith("slide:") && selected
        ? `slide:${selected.id}`
        : previousValue;
      elements.crosscheckScope.value = availableValues.includes(requestedValue)
        ? requestedValue
        : selected && availableValues.includes(`module:${selected.moduleId}`)
          ? `module:${selected.moduleId}`
          : "all";
    }

    function crosscheckSlidesForScope() {
      const scope = elements.crosscheckScope.value || "all";
      const eligible = state.slides.filter((slide) =>
        slide.svgProposal?.url && slide.crosscheck?.referenceMapping?.mapping_type !== "absorbed_source"
      );
      if (scope.startsWith("module:")) {
        const moduleId = scope.slice("module:".length);
        return eligible.filter((slide) => slide.moduleId === moduleId);
      }
      if (scope.startsWith("slide:")) {
        const slideId = scope.slice("slide:".length);
        return eligible.filter((slide) => slide.id === slideId);
      }
      return eligible;
    }

    function presentationSlideList() {
      const source = state.filtered.length ? state.filtered : state.slides;
      return source.filter((slide) => !slideIsHidden(slide) && slide.svgProposal?.url && slideIncludedInPresentation(slide));
    }

    function presentationStartIndex(slides) {
      const index = slides.findIndex((slide) => slide.id === state.selectedId);
      return index >= 0 ? index : 0;
    }

    function updatePresentationButton() {
      const count = presentationSlideList().length;
      elements.presentationMode.disabled = count === 0;
      elements.presentationMode.title = count
        ? `${count} neue SVG-Folien praesentieren`
        : "Keine neuen SVG-Folien im aktuellen Filter";
    }

    function badge(label, kind = "") {
      const span = document.createElement("span");
      span.className = `badge ${kind}`.trim();
      span.textContent = label;
      return span;
    }

    function statusBadges(slide) {
      const badges = [];
      if (slide.isAdditionalSlide) {
        badges.push(badge("Zusatz", "warn"));
      } else {
        badges.push(badge(slide.status.hasOldSlide ? "PNG" : "kein PNG", slide.status.hasOldSlide ? "ok" : "miss"));
      }
      badges.push(badge(slide.status.hasSvgProposal ? "SVG" : "kein SVG", slide.status.hasSvgProposal ? "ok" : "warn"));
      if (slide.svgProposal?.aliasForSlideNumber) {
        badges.push(badge(`Master ${String(slide.svgProposal.aliasForSlideNumber).padStart(3, "0")}`, "ok"));
      }
      if (slide.status.hasAnimation) {
        badges.push(badge(`Animation ${slide.svgProposal?.animation?.stepCount || ""}`.trim(), "ok"));
      }
      if (Array.isArray(slide.review?.versions) && slide.review.versions.length) {
        badges.push(badge(`${slide.review.versions.length} Versionen`, "ok"));
      }
      if (slide.status.hasSvgProposal && !slideIncludedInPresentation(slide)) {
        badges.push(badge("Praesentation aus", "warn"));
      }
      if (slideIsHidden(slide)) {
        badges.push(badge("ausgeblendet", "miss"));
      }
      badges.push(badge(slide.status.hasAnalysis ? slide.status.qaCompleteness : "keine Analyse", slide.status.hasAnalysis ? "" : "warn"));
      if (slide.review?.status && slide.review.status !== "open") {
        badges.push(badge(slide.review.status, slide.review.status === "accepted" || slide.review.status === "final" ? "ok" : "warn"));
      }
      if (slide.crosscheck?.report) {
        const crosscheckStatus = crosscheckStatusInfo(slide.crosscheck.report.status);
        badges.push(badge(
          slide.crosscheck.report.is_stale ? "Crosscheck veraltet" : crosscheckStatus.label,
          slide.crosscheck.report.is_stale
            ? "warn"
            : crosscheckStatus.tone === "error"
              ? "miss"
              : crosscheckStatus.tone,
        ));
      }
      return badges;
    }

    function makeMedia(record, alt) {
      if (!record?.url) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = alt;
        return empty;
      }
      const image = document.createElement("img");
      image.className = `media ${state.fit === "fit" ? "" : state.fit}`.trim();
      image.src = `${record.url}?v=${Date.now()}`;
      image.alt = alt;
      return image;
    }

    function makeEmpty(text) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = text;
      return empty;
    }

    function formatTime(ms) {
      const totalSeconds = Math.max(0, Math.round(Number(ms || 0) / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function formatSeconds(ms) {
      const seconds = Math.max(0, Number(ms || 0) / 1000);
      return `${seconds.toLocaleString("de-DE", {
        minimumFractionDigits: seconds % 1 ? 1 : 0,
        maximumFractionDigits: 1,
      })} s`;
    }

    function setAnimationStatus(text) {
      elements.animationStatus.textContent = text;
      elements.fullscreenStatus.textContent = text;
    }

    function requestViewerFullscreen() {
      try {
        elements.fullscreenViewer.requestFullscreen?.()?.catch?.(() => {});
      } catch {
        // The fullscreen panel remains usable when browser fullscreen is unavailable.
      }
    }

    function exitViewerFullscreen() {
      try {
        document.exitFullscreen?.()?.catch?.(() => {});
      } catch {
        // Ignore browser-specific fullscreen teardown failures.
      }
    }

    function closeFullscreenViewer() {
      if (!state.fullscreenOpen) return;
      const presentationSlide = state.fullscreenMode === "presentation"
        ? state.presentationSlides[state.presentationIndex]
        : null;
      if (state.fullscreenMode === "single") {
        const svgElement = state.previewSvg || state.animationSvg;
        if (svgElement && state.fullscreenPlaceholder?.parentNode) {
          state.fullscreenPlaceholder.replaceWith(svgElement);
        } else if (svgElement) {
          elements.svgFrame.replaceChildren(svgElement);
        }
      }
      elements.fullscreenSvgFrame.replaceChildren();
      elements.fullscreenViewer.hidden = true;
      elements.fullscreenViewer.classList.remove("presentation");
      state.fullscreenOpen = false;
      state.fullscreenMode = "single";
      state.fullscreenPlaceholder = null;
      state.presentationSlides = [];
      state.presentationIndex = 0;
      state.presentationToken += 1;
      if (document.fullscreenElement === elements.fullscreenViewer) {
        exitViewerFullscreen();
      }
      if (presentationSlide) {
        selectSlide(presentationSlide.id);
      } else {
        renderAnimationControls();
      }
    }

    function openFullscreenViewer() {
      const svgElement = state.previewSvg || state.animationSvg;
      if (!svgElement) return;
      const slide = selectedSlide();
      state.fullscreenMode = "single";
      state.presentationSlides = [];
      state.presentationIndex = 0;
      state.presentationToken += 1;
      elements.fullscreenViewer.classList.remove("presentation");
      state.fullscreenPlaceholder = document.createComment("fullscreen-svg-placeholder");
      svgElement.replaceWith(state.fullscreenPlaceholder);
      elements.fullscreenSvgFrame.replaceChildren(svgElement);
      elements.fullscreenTitle.textContent = slide
        ? `${slide.moduleId} · Folie ${String(slide.slideNumber).padStart(3, "0")} · SVG-Vorschlag`
        : "SVG-Vorschlag";
      if (slide) {
        elements.fullscreenTitle.textContent =
          `${slide.moduleId} - Folie ${String(slide.slideNumber).padStart(3, "0")} - ${activeVersionLabel(slide)}`;
      }
      elements.fullscreenViewer.hidden = false;
      state.fullscreenOpen = true;
      renderAnimationControls();
      if (state.animationManifest) renderAnimationAt(state.animationTime);
      requestViewerFullscreen();
    }

    async function renderPresentationSlide() {
      if (!state.fullscreenOpen || state.fullscreenMode !== "presentation") return;
      const slide = state.presentationSlides[state.presentationIndex];
      const proposal = slide?.svgProposal;
      const token = state.presentationToken + 1;
      state.presentationToken = token;
      if (!slide || !proposal?.url) {
        elements.fullscreenSvgFrame.replaceChildren(makeEmpty("Keine neue SVG-Folie gefunden."));
        elements.fullscreenTitle.textContent = "Praesentation";
        elements.fullscreenCounter.textContent = "0 / 0";
        elements.fullscreenPreviousSlide.disabled = true;
        elements.fullscreenNextSlide.disabled = true;
        return;
      }

      const count = state.presentationSlides.length;
      elements.fullscreenTitle.textContent =
        `${slide.moduleId} - Folie ${String(slide.slideNumber).padStart(3, "0")} - ${slide.title}`;
      elements.fullscreenCounter.textContent = `${state.presentationIndex + 1} / ${count}`;
      elements.fullscreenPreviousSlide.disabled = state.presentationIndex <= 0;
      elements.fullscreenNextSlide.disabled = state.presentationIndex >= count - 1;
      clearAnimationState();
      elements.fullscreenStatus.textContent = proposal.animation?.available
        ? `Lade Animation mit ${proposal.animation.stepCount || 0} Schritten...`
        : "Keine Animation fuer diese SVG-Folie.";
      elements.fullscreenSvgFrame.replaceChildren(makeEmpty("SVG wird geladen..."));

      try {
        const response = await fetch(`${proposal.url}?v=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        const svgElement = parseSafeInlineSvg(text);
        if (token !== state.presentationToken) return;
        svgElement.classList.add("inline-svg");
        elements.fullscreenSvgFrame.replaceChildren(svgElement);
        if (proposal.animation?.exists && proposal.animation.url) {
          try {
            const manifestResponse = await fetch(`${proposal.animation.url}?v=${Date.now()}`);
            if (!manifestResponse.ok) throw new Error(`HTTP ${manifestResponse.status}`);
            const manifest = await manifestResponse.json();
            if (token !== state.presentationToken) return;
            setupAnimation(manifest, svgElement, proposal.animation.defaultPauseMs);
          } catch (error) {
            if (token !== state.presentationToken) return;
            clearAnimationState();
            elements.fullscreenStatus.textContent = `Animation konnte nicht geladen werden: ${error.message}`;
          }
        } else {
          renderAnimationControls();
        }
      } catch (error) {
        if (token !== state.presentationToken) return;
        clearAnimationState();
        elements.fullscreenSvgFrame.replaceChildren(makeEmpty(`SVG konnte nicht geladen werden: ${error.message}`));
      }
    }

    function openPresentationMode() {
      const slides = presentationSlideList();
      if (!slides.length) return;
      if (state.fullscreenOpen) closeFullscreenViewer();
      stopAnimationPlayback();
      state.fullscreenMode = "presentation";
      state.fullscreenPlaceholder = null;
      state.presentationSlides = slides;
      state.presentationIndex = presentationStartIndex(slides);
      elements.fullscreenViewer.classList.add("presentation");
      elements.fullscreenViewer.hidden = false;
      state.fullscreenOpen = true;
      renderPresentationSlide();
      requestViewerFullscreen();
    }

    function movePresentation(offset) {
      if (!state.fullscreenOpen || state.fullscreenMode !== "presentation") return false;
      const nextIndex = Math.max(
        0,
        Math.min(state.presentationSlides.length - 1, state.presentationIndex + offset)
      );
      if (nextIndex !== state.presentationIndex) {
        state.presentationIndex = nextIndex;
        renderPresentationSlide();
      }
      return true;
    }

    function stopAnimationPlayback() {
      cancelAnimationFrame(state.animationFrame);
      state.animationFrame = 0;
      state.animationPlaying = false;
      state.animationPaused = false;
      state.animationLastTimestamp = 0;
      renderAnimationControls();
    }

    function clearAnimationState() {
      stopAnimationPlayback();
      state.animationManifest = null;
      state.animationSvg = null;
      state.animationTimeline = [];
      state.animationTime = 0;
      state.animationDuration = 0;
      state.originalTargetStyles = new Map();
      elements.animationTimeline.value = "0";
      elements.animationTimeline.max = "1";
      elements.animationCurrent.textContent = "0:00";
      elements.animationTotal.textContent = "0:00";
      elements.fullscreenTimeline.value = "0";
      elements.fullscreenTimeline.max = "1";
      elements.fullscreenCurrent.textContent = "0:00";
      elements.fullscreenTotal.textContent = "0:00";
      elements.animationBar.hidden = true;
      setAnimationStatus("Keine Animation fuer diesen SVG-Vorschlag.");
      renderAnimationControls();
    }

    function resetAnimationState() {
      closeFullscreenViewer();
      clearAnimationState();
    }

    function renderAnimationControls() {
      const available = Boolean(state.animationManifest?.steps?.length && state.animationSvg);
      syncAnimationDelayControls();
      elements.animationPlay.disabled = !available;
      elements.animationReset.disabled = !available;
      elements.animationDelay.disabled = !available;
      elements.animationTimeline.disabled = !available;
      elements.fullscreenPlay.disabled = !available;
      elements.fullscreenReset.disabled = !available;
      elements.fullscreenDelay.disabled = !available;
      elements.fullscreenTimeline.disabled = !available;
      elements.svgFullscreen.disabled = !(state.previewSvg || state.animationSvg);
      elements.svgAnimationEdit.disabled =
        !activeSvgProposal(selectedSlide()) || state.selectedVersionId !== "current";
      const playLabel = state.animationPlaying
        ? state.animationPaused
          ? "Fortsetzen"
          : "Pause"
        : "Abspielen";
      elements.animationPlay.textContent = playLabel;
      elements.fullscreenPlay.textContent = playLabel;
      updatePresentationButton();
    }

    function normalizeAnimationManifest(manifest) {
      const fallback = {
        schemaVersion: "svgAnimationManifest/v1",
        defaults: {},
        targets: [],
        steps: [],
      };
      const parsed = manifest && typeof manifest === "object" ? manifest : {};
      return {
        ...fallback,
        ...parsed,
        defaults: parsed.defaults && typeof parsed.defaults === "object" ? parsed.defaults : {},
        targets: Array.isArray(parsed.targets)
          ? parsed.targets
              .map((target) => ({
                ...target,
                targetId: target.targetId || target.id || "",
                status: target.status || "animated",
                render: target.render !== false,
              }))
              .filter((target) => target.targetId)
          : [],
        steps: Array.isArray(parsed.steps)
          ? parsed.steps.filter((step) => step?.targetId)
          : [],
      };
    }

    function animationTargets() {
      return (state.animationManifest?.targets || []).filter((target) =>
        target.render !== false && target.status === "animated"
      );
    }

    function findAnimationTarget(targetId) {
      return state.animationSvg?.querySelector(`#${CSS.escape(targetId)}`) || null;
    }

    function captureTargetStyles() {
      state.originalTargetStyles = new Map();
      for (const target of animationTargets()) {
        const element = findAnimationTarget(target.targetId);
        if (element) {
          state.originalTargetStyles.set(target.targetId, element.getAttribute("style"));
        }
      }
    }

    function restoreTargetStyle(targetId) {
      const element = findAnimationTarget(targetId);
      if (!element) return null;
      const style = state.originalTargetStyles.get(targetId);
      if (style == null) {
        element.removeAttribute("style");
      } else {
        element.setAttribute("style", style);
      }
      return element;
    }

    function hideAnimationTarget(targetId) {
      const element = restoreTargetStyle(targetId);
      if (!element) return;
      element.style.visibility = "hidden";
      element.style.opacity = "0";
      element.style.pointerEvents = "none";
    }

    function clipPathForDirection(direction, progress) {
      const remaining = Math.max(0, Math.min(100, (1 - progress) * 100));
      if (direction === "rightToLeft") return `inset(0 0 0 ${remaining}%)`;
      if (direction === "topToBottom") return `inset(0 0 ${remaining}% 0)`;
      if (direction === "bottomToTop") return `inset(${remaining}% 0 0 0)`;
      return `inset(0 ${remaining}% 0 0)`;
    }

    function applyStepProgress(step, progress) {
      const element = restoreTargetStyle(step.targetId);
      if (!element) return;
      const value = Math.max(0, Math.min(1, progress));
      if (step.action === "hide") {
        element.style.visibility = "visible";
        element.style.opacity = String(1 - value);
        return;
      }
      element.style.visibility = "visible";
      element.style.opacity = String(Math.max(0.15, value));
      element.style.pointerEvents = "none";
      if (step.action === "draw") {
        element.style.clipPath = clipPathForDirection(step.direction, value);
      }
    }

    function applyStepFinal(step) {
      const element = restoreTargetStyle(step.targetId);
      if (!element) return;
      if (step.action === "hide") {
        element.style.visibility = "hidden";
        element.style.opacity = "0";
        return;
      }
      element.style.visibility = "visible";
      element.style.opacity = "1";
      element.style.clipPath = "";
      element.style.pointerEvents = "none";
    }

    function frameDuration(step) {
      const defaults = state.animationManifest?.defaults || {};
      const frames =
        step.action === "draw"
          ? step.drawDurFrames ?? step.durFrames ?? defaults.drawDurFrames ?? 30
          : step.action === "highlight"
            ? step.highlightDurFrames ?? defaults.highlightDurFrames ?? 24
            : step.action === "hide"
              ? step.exitFrames ?? defaults.exitFrames ?? 16
              : step.enterFrames ?? defaults.enterFrames ?? 16;
      return Math.max(200, Math.min(2500, (Number(frames) / 30) * 1000));
    }

    function orderedAnimationSteps() {
      const targetIds = new Set(animationTargets().map((target) => target.targetId));
      return (state.animationManifest?.steps || [])
        .filter((step) => targetIds.has(step.targetId))
        .map((step, originalIndex) => ({ step, originalIndex }));
    }

    function animationDelayOptions() {
      const options = [...elements.animationDelay.options]
        .map((option) => Number(option.value))
        .filter((value) => Number.isFinite(value) && value > 0);
      return options.length ? options : [2500];
    }

    function closestAnimationDelay(value) {
      const requested = Number(value);
      const options = animationDelayOptions();
      if (!Number.isFinite(requested) || requested <= 0) return state.animationPauseMs || options[0];
      return options.reduce((best, value) =>
        Math.abs(value - requested) < Math.abs(best - requested) ? value : best,
      );
    }

    function syncAnimationDelayControls() {
      const value = String(closestAnimationDelay(state.animationPauseMs));
      state.animationPauseMs = Number(value);
      elements.animationDelay.value = value;
      elements.fullscreenDelay.value = value;
    }

    function setAnimationDelay(value, userSelected = false) {
      state.animationPauseMs = closestAnimationDelay(value);
      if (userSelected) state.animationPauseUserSelected = true;
      syncAnimationDelayControls();
    }

    function applyAnimationDelayDefault(defaultDelayMs) {
      if (state.animationPauseUserSelected || state.fullscreenMode === "presentation") {
        syncAnimationDelayControls();
        return;
      }
      const requested = Number(defaultDelayMs);
      if (!Number.isFinite(requested) || requested <= 0) {
        syncAnimationDelayControls();
        return;
      }
      const closest = closestAnimationDelay(requested);
      state.animationPauseMs = closest;
      elements.animationDelay.value = String(closest);
      elements.fullscreenDelay.value = String(closest);
    }

    function buildAnimationTimeline() {
      const orderedSteps = orderedAnimationSteps();
      const pause = Number(state.animationPauseMs) || 0;
      let cursor = 0;
      state.animationTimeline = orderedSteps.map((entry, index) => {
        const start = cursor;
        const end = start + frameDuration(entry.step);
        const pauseEnd = end + (index < orderedSteps.length - 1 ? pause : 0);
        cursor = pauseEnd;
        return { ...entry, index, start, end, pauseEnd };
      });
      state.animationDuration = cursor;
      elements.animationTimeline.max = String(Math.max(1, Math.round(cursor)));
      state.animationTime = Math.min(state.animationTime, cursor);
      elements.animationTotal.textContent = formatTime(cursor);
      elements.fullscreenTimeline.max = elements.animationTimeline.max;
      elements.fullscreenTotal.textContent = formatTime(cursor);
    }

    function rebuildAnimationTimelineKeepingPosition() {
      if (!state.animationManifest) return;
      const oldDuration = state.animationDuration;
      const ratio = oldDuration > 0 ? state.animationTime / oldDuration : 0;
      buildAnimationTimeline();
      renderAnimationAt(state.animationDuration * ratio);
    }

    function handleAnimationDelayChange(value) {
      setAnimationDelay(value, true);
      rebuildAnimationTimelineKeepingPosition();
    }

    function renderAnimationAt(time) {
      if (!state.animationManifest || !state.animationSvg) return;
      const clamped = Math.max(0, Math.min(Number(time || 0), state.animationDuration));
      state.animationTime = clamped;

      for (const target of animationTargets()) {
        hideAnimationTarget(target.targetId);
      }

      let activeSegment = null;
      let lastCompletedSegment = null;
      for (const segment of state.animationTimeline) {
        if (clamped < segment.start) break;
        if (clamped >= segment.end) {
          applyStepFinal(segment.step);
          lastCompletedSegment = segment;
        } else {
          activeSegment = segment;
          const progress = (clamped - segment.start) / Math.max(1, segment.end - segment.start);
          applyStepProgress(segment.step, progress);
          break;
        }
      }

      elements.animationTimeline.value = String(Math.round(clamped));
      elements.animationCurrent.textContent = formatTime(clamped);
      elements.fullscreenTimeline.value = elements.animationTimeline.value;
      elements.fullscreenCurrent.textContent = elements.animationCurrent.textContent;
      if (clamped >= state.animationDuration && state.animationTimeline.length) {
        setAnimationStatus(`Animation abgeschlossen - ${state.animationTimeline.length} Schritte.`);
      } else if (activeSegment) {
        const target = state.animationManifest.targets.find((item) => item.targetId === activeSegment.step.targetId);
        setAnimationStatus(`Schritt ${activeSegment.index + 1}/${state.animationTimeline.length}: ${target?.label || activeSegment.step.targetId}`);
      } else if (lastCompletedSegment) {
        setAnimationStatus(`Pause ${formatSeconds(state.animationPauseMs)} nach Schritt ${lastCompletedSegment.index + 1}/${state.animationTimeline.length}.`);
      } else {
        setAnimationStatus(`Start - ${state.animationTimeline.length} Schritte.`);
      }
      renderAnimationControls();
    }

    function resetAnimationPreview() {
      stopAnimationPlayback();
      renderAnimationAt(0);
    }

    function playAnimation() {
      if (!state.animationManifest || !state.animationSvg) return;
      if (state.animationPlaying) {
        state.animationPaused = !state.animationPaused;
        state.animationLastTimestamp = 0;
        renderAnimationControls();
        return;
      }
      if (state.animationTime >= state.animationDuration) {
        renderAnimationAt(0);
      }
      state.animationPlaying = true;
      state.animationPaused = false;
      state.animationLastTimestamp = 0;
      const tick = (timestamp) => {
        if (!state.animationPlaying) return;
        if (state.animationPaused) {
          state.animationFrame = requestAnimationFrame(tick);
          return;
        }
        if (!state.animationLastTimestamp) state.animationLastTimestamp = timestamp;
        const delta = timestamp - state.animationLastTimestamp;
        state.animationLastTimestamp = timestamp;
        renderAnimationAt(state.animationTime + delta);
        if (state.animationTime >= state.animationDuration) {
          stopAnimationPlayback();
          renderAnimationAt(state.animationDuration);
          return;
        }
        state.animationFrame = requestAnimationFrame(tick);
      };
      renderAnimationControls();
      state.animationFrame = requestAnimationFrame(tick);
    }

    function parseSafeInlineSvg(source) {
      const documentSvg = new DOMParser().parseFromString(source, "image/svg+xml");
      const root = documentSvg.documentElement;
      if (documentSvg.querySelector("parsererror") || root?.localName?.toLowerCase() !== "svg") {
        throw new Error("SVG konnte nicht geparst werden.");
      }
      documentSvg.querySelectorAll("script, foreignObject, iframe, object, embed").forEach((node) => node.remove());
      documentSvg.querySelectorAll("style").forEach((style) => {
        if (/@import|javascript:|url\(\s*['\"]?(?:https?:|\/\/)/i.test(style.textContent || "")) {
          style.remove();
        }
      });
      documentSvg.querySelectorAll("*").forEach((node) => {
        for (const attribute of [...node.attributes]) {
          const name = attribute.name.toLowerCase();
          const value = attribute.value.trim();
          if (name.startsWith("on")) {
            node.removeAttribute(attribute.name);
          } else if (
            ["href", "xlink:href", "src"].includes(name) &&
            /^(?:javascript:|vbscript:|data:text\/html|https?:|\/\/)/i.test(value)
          ) {
            node.removeAttribute(attribute.name);
          } else if (
            name === "style" &&
            /javascript:|url\(\s*['\"]?(?:https?:|\/\/)/i.test(value)
          ) {
            node.removeAttribute(attribute.name);
          }
        }
      });
      root.removeAttribute("width");
      root.removeAttribute("height");
      if (!root.getAttribute("preserveAspectRatio")) root.setAttribute("preserveAspectRatio", "xMidYMid meet");
      return document.importNode(root, true);
    }

    function setupAnimation(manifest, svgElement, defaultPauseMs) {
      state.animationManifest = normalizeAnimationManifest(manifest);
      for (const target of state.animationManifest.targets) {
        if (target.render !== false) continue;
        const element = svgElement.id === target.targetId
          ? svgElement
          : svgElement.querySelector(`#${CSS.escape(target.targetId)}`);
        if (!element) continue;
        if (element === svgElement) {
          element.style.display = "none";
        } else {
          element.remove();
        }
      }
      state.animationSvg = svgElement;
      elements.animationBar.hidden =
        state.fullscreenMode === "presentation" || !state.animationManifest.steps.length;
      applyAnimationDelayDefault(
        state.animationManifest.defaults?.pauseMs ??
          state.animationManifest.defaults?.stepDelayMs ??
          defaultPauseMs,
      );
      captureTargetStyles();
      buildAnimationTimeline();
      renderAnimationAt(state.animationDuration);
    }

    async function renderSvgProposal(slide, token) {
      const proposal = activeSvgProposal(slide);
      if (!proposal?.url) {
        state.previewSvg = null;
        resetAnimationState();
        elements.svgFrame.replaceChildren(makeEmpty(
          slide.isAdditionalSlide
            ? "Noch kein SVG-Vorschlag vorhanden. Beschreibe die neue Folie rechts in den Notizen."
            : "Kein SVG-Vorschlag gefunden.",
        ));
        return;
      }

      elements.svgFrame.replaceChildren(makeEmpty("SVG-Vorschlag wird geladen..."));
      try {
        const response = await fetch(`${proposal.url}?v=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const source = await response.text();
        if (token !== state.renderToken) return;
        const svgElement = parseSafeInlineSvg(source);
        svgElement.classList.add("inline-svg");
        if (state.fit !== "fit") svgElement.classList.add(state.fit);
        state.previewSvg = svgElement;
        elements.svgFrame.replaceChildren(svgElement);

        if (proposal.animation?.exists && proposal.animation.url) {
          const manifestResponse = await fetch(`${proposal.animation.url}?v=${Date.now()}`);
          if (!manifestResponse.ok) throw new Error(`Animationsmanifest HTTP ${manifestResponse.status}`);
          const manifest = await manifestResponse.json();
          if (token !== state.renderToken) return;
          setupAnimation(manifest, svgElement, proposal.animation.defaultPauseMs);
        } else {
          resetAnimationState();
        }
      } catch (error) {
        state.previewSvg = null;
        resetAnimationState();
        elements.svgFrame.replaceChildren(makeMedia(proposal, `SVG konnte nicht inline geladen werden: ${error.message}`));
      }
    }

    function renderList() {
      elements.slideList.replaceChildren();
      let currentModule = "";
      for (const slide of state.filtered) {
        if (slide.moduleId !== currentModule) {
          currentModule = slide.moduleId;
          const label = document.createElement("div");
          label.className = "module-label";
          label.textContent = currentModule;
          elements.slideList.append(label);
        }

        const button = document.createElement("button");
        button.className = `slide-item ${slide.id === state.selectedId ? "active" : ""} ${slideIsHidden(slide) ? "hidden-slide" : ""}`.trim();
        button.type = "button";
        button.addEventListener("click", () => selectSlide(slide.id));

        const title = document.createElement("div");
        title.className = "slide-title";
        title.textContent = slide.title;
        const meta = document.createElement("div");
        meta.className = "slide-meta";
        meta.textContent = `${slide.slideId} · ${slideDisplayLabel(slide)}`;
        const badges = document.createElement("div");
        badges.className = "badges";
        statusBadges(slide).forEach((item) => badges.append(item));

        button.append(title, meta, badges);
        elements.slideList.append(button);
      }
    }

    function renderDefinitionList(node, entries) {
      node.replaceChildren();
      for (const [label, value] of entries) {
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        if (value?.href) {
          const link = document.createElement("a");
          link.className = "path-link";
          link.href = value.href;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = value.text;
          dd.append(link);
        } else {
          dd.textContent = value || "-";
        }
        node.append(dt, dd);
      }
    }

    function renderVersionSelect(slide, versions) {
      elements.versionSelect.replaceChildren();

      const current = document.createElement("option");
      current.value = "current";
      current.textContent = "Aktuelle Version";
      elements.versionSelect.append(current);

      versions.forEach((version) => {
        const option = document.createElement("option");
        option.value = version.version_id;
        option.textContent = version.label || version.version_id;
        elements.versionSelect.append(option);
      });

      const hasSelectedVersion = versions.some((version) => version.version_id === state.selectedVersionId);
      if (state.selectedVersionId !== "current" && !hasSelectedVersion) {
        state.selectedVersionId = "current";
      }
      elements.versionSelect.value = state.selectedVersionId;
      elements.versionSelect.disabled = !slide.svgProposal && !versions.length;
    }

    function renderDetails(slide) {
      const archivedVersion = selectedArchivedVersion(slide);
      const reviewVersions = Array.isArray(slide.review?.versions) ? slide.review.versions : [];

      renderDefinitionList(elements.meta, [
        ["Modul", slide.moduleId],
        ["Typ", slide.isAdditionalSlide ? "Zusatzfolie" : "Quellfolie"],
        ["Folie", slideDisplayLabel(slide)],
        ["Anzeige", slideIsHidden(slide) ? "ausgeblendet" : "aktiv"],
        ["Slide-ID", slide.slideId],
        ["Einfuegen nach", slide.isAdditionalSlide && slide.additionalSlide?.insert_after_slide_number
          ? `Folie ${String(slide.additionalSlide.insert_after_slide_number).padStart(3, "0")}`
          : "-"],
        ["Alte Folie", slide.oldSlide ? { text: slide.oldSlide.path, href: slide.oldSlide.url } : "-"],
        ["SVG", activeSvgProposal(slide) ? { text: activeSvgProposal(slide).path, href: activeSvgProposal(slide).url } : "-"],
        ["Version", activeVersionLabel(slide)],
        ["Praesentation", slide.svgProposal?.url ? (slideIncludedInPresentation(slide) ? "anzeigen" : "ausgeblendet") : "-"],
        ["SVG-Alias", slide.svgProposal?.aliasForSlideNumber ? `Master von Folie ${String(slide.svgProposal.aliasForSlideNumber).padStart(3, "0")}` : "-"],
        ["Animation", activeSvgProposal(slide)?.animation?.available ? `${activeSvgProposal(slide).animation.stepCount} Schritte` : "-"],
      ]);

      renderVersionSelect(slide, reviewVersions);
      elements.reviewStatus.value = archivedVersion?.review_status || slide.review?.status || "open";
      elements.reviewNotes.value = archivedVersion?.notes || slide.review?.notes || "";
      elements.reviewNotes.placeholder = slide.isAdditionalSlide
        ? "Beschreibe hier den neuen Folienvorschlag: Inhalt, Kernaussage, gewuenschte Visualisierung, Animationen und Bezug zu den Nachbarfolien."
        : "Notizen zum Abgleich zwischen alter Folie und SVG-Vorschlag";
      elements.reviewStatus.disabled = Boolean(archivedVersion);
      elements.reviewNotes.disabled = Boolean(archivedVersion);
      elements.saveReview.disabled = Boolean(archivedVersion);
      elements.includeInPresentation.checked = slideIncludedInPresentation(slide);
      elements.includeInPresentation.disabled = Boolean(archivedVersion) || !slide.svgProposal?.url || slideIsHidden(slide);
      elements.presentationMessage.textContent = archivedVersion
        ? "Archivstand ist nur lesend; die aktuelle Folie steuert den Praesentationsmodus."
        : slideIsHidden(slide)
          ? "Ausgeblendete Folien erscheinen nicht im Praesentationsmodus."
        : !slide.svgProposal?.url
          ? "Keine neue SVG-Folie fuer den Praesentationsmodus vorhanden."
          : slideIncludedInPresentation(slide)
            ? "Diese Folie erscheint im Praesentationsmodus."
            : "Diese Folie wird im Praesentationsmodus uebersprungen.";
      elements.versionMessage.textContent = archivedVersion
        ? `Archivstand vom ${archivedVersion.created_at ? new Date(archivedVersion.created_at).toLocaleString("de-DE") : "unbekannten Zeitpunkt"}; nur lesend.`
        : slide.review?.pending_before_snapshot
          ? "Offene Notiz: Vorherstand ist vorbereitet und wird nach Behebung im Verlauf sichtbar."
          : reviewVersions.length
          ? `${reviewVersions.length} archivierte Versionen verfuegbar.`
          : "Noch keine archivierte Version.";
      elements.reviewMessage.textContent = archivedVersion
        ? "Archivierte Notiz wird angezeigt."
        : slide.review?.updated_at
          ? `Gespeichert: ${new Date(slide.review.updated_at).toLocaleString("de-DE")}`
          : "";
    }

    function renderMedia(slide) {
      const token = state.renderToken + 1;
      const proposal = activeSvgProposal(slide);
      const reference = primaryCrosscheckReference(slide);
      const oldSlide = reference?.oldSlide || slide.oldSlide;
      state.renderToken = token;
      resetAnimationState();
      state.previewSvg = null;
      elements.oldFrame.replaceChildren(makeMedia(
        oldSlide,
        slide.isAdditionalSlide
          ? "Zusatzfolie: keine alte Foliengrafik vorhanden."
          : "Keine alte Foliengrafik gefunden.",
      ));
      renderSvgProposal(slide, token);

      elements.oldOpen.hidden = !oldSlide;
      elements.svgOpen.hidden = !proposal;
      if (oldSlide) elements.oldOpen.href = oldSlide.url;
      if (proposal) elements.svgOpen.href = proposal.url;
    }

    function selectSlide(id) {
      const slide = state.slides.find((item) => item.id === id);
      if (!slide) return;
      const slideChanged = state.selectedId !== id;
      if (slideChanged) {
        state.selectedVersionId = "current";
      }
      state.selectedId = id;
      elements.title.textContent = slide.title;
      elements.subtitle.textContent = slideSubtitle(slide);
      renderMedia(slide);
      renderDetails(slide);
      renderList();
      updateNavigation();
      renderCrosscheckScopeOptions();
      location.hash = encodeURIComponent(id);
    }

    function applyFilter() {
      const query = elements.search.value.trim().toLocaleLowerCase("de");
      const moduleId = elements.moduleFilter.value;
      state.filtered = state.slides.filter((slide) => {
        if (moduleId && slide.moduleId !== moduleId) return false;
        if (slideIsHidden(slide) && !state.showHidden) return false;
        if (!query) return true;
        return [
          slide.moduleId,
          slide.slideId,
          slide.title,
          slide.analysis?.summary?.slideSummary?.core_message,
          slide.review?.notes,
          ...(Array.isArray(slide.review?.versions) ? slide.review.versions.map((version) => version.notes) : []),
        ]
          .filter(Boolean)
          .some((value) => String(value).toLocaleLowerCase("de").includes(query));
      });
      if (!state.filtered.some((slide) => slide.id === state.selectedId)) {
        state.selectedId = "";
      }
      renderList();
      if (!state.selectedId && state.filtered[0]) selectSlide(state.filtered[0].id);
      elements.count.textContent = `${state.filtered.length} von ${state.slides.length} Folien angezeigt`;
      updateNavigation();
    }

    function updateSlideActionButtons() {
      const slide = selectedSlide();
      const index = selectedIndex();
      const canMove = Boolean(slide) && !slideIsHidden(slide);
      elements.moveSlideUp.disabled = !canMove || index <= 0;
      elements.moveSlideDown.disabled = !canMove || index < 0 || index >= state.filtered.length - 1;
      elements.deleteSlide.disabled = !slide;
      elements.deleteSlide.textContent = slide && slideIsHidden(slide) ? "Wiederherstellen" : "Folie loeschen";
      elements.deleteSlide.classList.toggle("danger", !(slide && slideIsHidden(slide)));
    }

    function updateNavigation() {
      const index = selectedIndex();
      elements.previous.disabled = index <= 0;
      elements.next.disabled = index < 0 || index >= state.filtered.length - 1;
      updatePresentationButton();
      updateSlideActionButtons();
    }

    function move(offset) {
      const index = selectedIndex();
      const next = state.filtered[index + offset];
      if (next) selectSlide(next.id);
    }

    function changeVersion() {
      const slide = selectedSlide();
      if (!slide) return;
      state.selectedVersionId = elements.versionSelect.value || "current";
      renderMedia(slide);
      renderDetails(slide);
    }

    function openGlobalCrosscheckPanel() {
      elements.globalCrosscheckBackdrop.hidden = false;
    }

    function closeGlobalCrosscheckPanel() {
      if (state.crosscheckRunning) return;
      elements.globalCrosscheckBackdrop.hidden = true;
    }

    function renderGlobalCrosscheckResults() {
      elements.crosscheckResults.replaceChildren();
      if (!state.crosscheckResults.length) {
        elements.crosscheckResults.append(makeEmpty("Noch keine Folie geprueft."));
        return;
      }

      state.crosscheckResults.forEach((entry) => {
        const report = entry.report || {};
        const counts = report.summary || {};
        const statusInfo = crosscheckStatusInfo(report.status);
        const item = document.createElement("article");
        item.className = "global-crosscheck-result";

        const header = document.createElement("div");
        header.className = "global-crosscheck-result-header";
        const title = document.createElement("div");
        title.className = "global-crosscheck-result-title";
        title.textContent = `${entry.moduleId} · ${slideDisplayLabel(entry)}`;
        const status = document.createElement("span");
        status.className = `crosscheck-status ${statusInfo.tone}`.trim();
        status.textContent = statusInfo.label;
        const openSlide = document.createElement("button");
        openSlide.className = "link-button";
        openSlide.type = "button";
        openSlide.textContent = "Folie anzeigen";
        openSlide.addEventListener("click", () => {
          closeGlobalCrosscheckPanel();
          selectSlide(entry.id);
        });
        header.append(title, status, openSlide);

        const meta = document.createElement("div");
        meta.className = "global-crosscheck-result-meta";
        const referenceSlides = Array.isArray(report.reference_mapping?.source_slides)
          ? report.reference_mapping.source_slides
          : [];
        meta.textContent = `${referenceSlides.length ? `Referenzen: ${referenceSlides.map((number) => `Folie ${String(number).padStart(3, "0")}`).join(", ")} · ` : ""}${counts.errors || 0} Fehler · ${counts.warnings || 0} Hinweise`;

        const findings = document.createElement("ul");
        findings.className = "global-crosscheck-findings";
        const reportFindings = Array.isArray(report.findings) ? report.findings : [];
        if (reportFindings.length) {
          reportFindings.forEach((finding) => {
            const findingItem = document.createElement("li");
            findingItem.dataset.severity = finding.severity || "info";
            findingItem.textContent = finding.message || finding.code || "Unbenannter Befund";
            findings.append(findingItem);
          });
        } else {
          const findingItem = document.createElement("li");
          findingItem.textContent = "Keine konkreten Uebertragungsfehler in der deterministischen Vorpruefung.";
          findings.append(findingItem);
        }

        item.append(header, meta, findings);
        elements.crosscheckResults.append(item);
      });
    }

    async function runGlobalCrosscheck() {
      if (state.crosscheckRunning) return;
      const slides = crosscheckSlidesForScope();
      state.crosscheckResults = [];
      openGlobalCrosscheckPanel();
      renderGlobalCrosscheckResults();
      if (!slides.length) {
        elements.crosscheckProgress.textContent = "Im gewaehlten Bereich gibt es keine pruefbare SVG-Folie.";
        return;
      }

      state.crosscheckRunning = true;
      elements.runCrosscheck.disabled = true;
      elements.crosscheckScope.disabled = true;
      elements.closeCrosscheck.disabled = true;
      try {
        for (let index = 0; index < slides.length; index += 1) {
          const slide = slides[index];
          elements.crosscheckProgress.textContent =
            `Pruefe ${index + 1} von ${slides.length}: ${slide.moduleId} · ${slideDisplayLabel(slide)}`;
          try {
            const response = await fetch("/api/crosscheck", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: slide.id }),
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
            slide.crosscheck = {
              ...(slide.crosscheck || {}),
              report: payload.crosscheck,
            };
            slide.status.crosscheckStatus = payload.crosscheck.status;
            state.crosscheckResults.push({
              id: slide.id,
              moduleId: slide.moduleId,
              slideNumber: slide.slideNumber,
              isAdditionalSlide: slide.isAdditionalSlide,
              additionalSlide: slide.additionalSlide,
              report: payload.crosscheck,
            });
          } catch (error) {
            state.crosscheckResults.push({
              id: slide.id,
              moduleId: slide.moduleId,
              slideNumber: slide.slideNumber,
              isAdditionalSlide: slide.isAdditionalSlide,
              additionalSlide: slide.additionalSlide,
              report: {
                status: "read_error",
                summary: { errors: 1, warnings: 0 },
                findings: [{ severity: "error", message: error.message }],
              },
            });
          }
          renderGlobalCrosscheckResults();
        }

        const totals = state.crosscheckResults.reduce((summary, entry) => ({
          errors: summary.errors + Number(entry.report?.summary?.errors || 0),
          warnings: summary.warnings + Number(entry.report?.summary?.warnings || 0),
