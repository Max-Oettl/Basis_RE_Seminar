        }), { errors: 0, warnings: 0 });
        elements.crosscheckProgress.textContent =
          `Abgeschlossen: ${state.crosscheckResults.length} Folien · ${totals.errors} Fehler · ${totals.warnings} Hinweise.`;
        renderList();
      } finally {
        state.crosscheckRunning = false;
        elements.runCrosscheck.disabled = false;
        elements.crosscheckScope.disabled = false;
        elements.closeCrosscheck.disabled = false;
      }
    }

    async function saveReview() {
      const slide = selectedSlide();
      if (!slide) return;
      if (selectedArchivedVersion(slide)) return;
      state.selectedVersionId = "current";
      elements.saveReview.disabled = true;
      elements.reviewMessage.textContent = "Speichere...";
      try {
        const response = await fetch("/api/review", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: slide.id,
            status: elements.reviewStatus.value,
            notes: elements.reviewNotes.value,
          }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        slide.review = payload.review;
        slide.status.reviewStatus = payload.review.status;
        renderDetails(slide);
        renderList();
        if (payload.archivedVersion) {
          elements.reviewMessage.textContent = payload.archivedVersion.reused
            ? `Gespeichert. Vorhandene Version bleibt verknuepft: ${payload.archivedVersion.label}.`
            : `Gespeichert. Version archiviert: ${payload.archivedVersion.label}.`;
        } else if (payload.review?.pending_before_snapshot) {
          elements.reviewMessage.textContent =
            "Notiz gespeichert. Verlaufsversion entsteht nach Behebung der Notiz.";
        }
      } catch (error) {
        elements.reviewMessage.textContent = error.message;
      } finally {
        elements.saveReview.disabled = Boolean(selectedArchivedVersion(slide));
      }
    }

    async function savePresentationPreference() {
      const slide = selectedSlide();
      if (!slide || selectedArchivedVersion(slide)) return;
      const previous = slideIncludedInPresentation(slide);
      const next = elements.includeInPresentation.checked;
      slide.review = {
        ...(slide.review || {}),
        include_in_presentation: next,
      };
      elements.presentationMessage.textContent = "Speichere Praesentationsauswahl...";
      renderList();
      updatePresentationButton();
      try {
        const response = await fetch("/api/presentation", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: slide.id,
            includeInPresentation: next,
          }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        slide.review = payload.review;
        slide.status.reviewStatus = payload.review.status;
        renderDetails(slide);
        renderList();
        updatePresentationButton();
      } catch (error) {
        slide.review = {
          ...(slide.review || {}),
          include_in_presentation: previous,
        };
        elements.includeInPresentation.checked = previous;
        elements.presentationMessage.textContent = error.message;
        renderList();
        updatePresentationButton();
      }
    }

    function hideDeleteUndoToast() {
      clearTimeout(state.deleteUndoTimer);
      state.deleteUndoTimer = 0;
      state.pendingDeleteUndo = null;
      elements.undoToast.hidden = true;
    }

    function showDeleteUndoToast(slide) {
      clearTimeout(state.deleteUndoTimer);
      state.pendingDeleteUndo = {
        id: slide.id,
        label: slideDisplayLabel(slide),
      };
      elements.undoToastText.textContent = "L\u00f6schen r\u00fcckg\u00e4ngig machen?";
      elements.undoToast.hidden = false;
      state.deleteUndoTimer = setTimeout(() => {
        hideDeleteUndoToast();
      }, 5000);
    }

    async function restoreDeletedSlideFromToast() {
      const undo = state.pendingDeleteUndo;
      if (!undo?.id) return;
      clearTimeout(state.deleteUndoTimer);
      elements.undoDelete.disabled = true;
      elements.undoToastText.textContent = "Stelle Folie wieder her...";
      try {
        const response = await fetch("/api/slide-curation", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: undo.id,
            action: "restore",
          }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        hideDeleteUndoToast();
        await loadSlides(undo.id);
        elements.sidebarMessage.textContent = "Loeschen rueckgaengig gemacht.";
      } catch (error) {
        elements.undoToastText.textContent = error.message;
      } finally {
        elements.undoDelete.disabled = false;
      }
    }

    async function applySelectedSlideCuration(action) {
      const slide = selectedSlide();
      if (!slide) return;
      const index = selectedIndex();
      const fallbackSlide = state.filtered[index + 1] || state.filtered[index - 1] || null;
      const preferredId = action === "hide" ? fallbackSlide?.id || "" : slide.id;
      elements.sidebarMessage.textContent = "Speichere Folienreihenfolge...";
      elements.moveSlideUp.disabled = true;
      elements.moveSlideDown.disabled = true;
      elements.deleteSlide.disabled = true;
      try {
        const response = await fetch("/api/slide-curation", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: slide.id,
            action,
          }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        await loadSlides(preferredId);
        if (action === "hide") {
          showDeleteUndoToast(slide);
        } else if (action === "restore" && state.pendingDeleteUndo?.id === slide.id) {
          hideDeleteUndoToast();
        }
        elements.sidebarMessage.textContent = action === "hide"
          ? "Folie ausgeblendet."
          : action === "restore"
            ? "Folie wiederhergestellt."
            : "Folienreihenfolge gespeichert.";
      } catch (error) {
        elements.sidebarMessage.textContent = error.message;
        updateSlideActionButtons();
      }
    }

    function moduleForAdditionalSlide() {
      const slide = selectedSlide();
      return slide?.moduleId || elements.moduleFilter.value || state.modules[0] || "";
    }

    function insertAfterForAdditionalSlide(moduleId) {
      const slide = selectedSlide();
      if (slide?.moduleId === moduleId) {
        return slide.isAdditionalSlide
          ? slide.additionalSlide?.insert_after_slide_number || null
          : slide.slideNumber;
      }

      const moduleSlides = state.slides
        .filter((item) => item.moduleId === moduleId && !item.isAdditionalSlide && Number.isFinite(Number(item.slideNumber)))
        .sort((left, right) => left.slideNumber - right.slideNumber);
      return moduleSlides.length ? moduleSlides[moduleSlides.length - 1].slideNumber : null;
    }

    async function addAdditionalSlide() {
      const moduleId = moduleForAdditionalSlide();
      if (!moduleId) {
        elements.sidebarMessage.textContent = "Kein Modul fuer Zusatzfolie gefunden.";
        return;
      }

      elements.addSlide.disabled = true;
      elements.sidebarMessage.textContent = "Lege Zusatzfolie an...";
      try {
        const response = await fetch("/api/additional-slide", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            moduleId,
            insertAfterSlideNumber: insertAfterForAdditionalSlide(moduleId),
          }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        elements.search.value = "";
        await loadSlides(payload.slide?.id || "");
        elements.sidebarMessage.textContent = "Zusatzfolie angelegt. Beschreibe den Vorschlag rechts in den Notizen.";
        elements.reviewNotes.focus();
      } catch (error) {
        elements.sidebarMessage.textContent = error.message;
      } finally {
        elements.addSlide.disabled = false;
      }
    }

    async function loadSlides(preferredId = "") {
      const response = await fetch(`/api/slides?v=${Date.now()}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      state.slides = payload.slides || [];
      state.modules = payload.modules || [];

      elements.moduleFilter.replaceChildren();
      const allOption = document.createElement("option");
      allOption.value = "";
      allOption.textContent = "Alle Module";
      elements.moduleFilter.append(allOption);
      state.modules.forEach((moduleId) => {
        const option = document.createElement("option");
        option.value = moduleId;
        option.textContent = moduleId;
        elements.moduleFilter.append(option);
      });

      elements.count.textContent = `${state.slides.length} Folien gefunden`;
      const hashId = decodeURIComponent(location.hash.slice(1));
      const requested =
        state.slides.find((slide) => slide.id === preferredId) ||
        state.slides.find((slide) => slide.id === hashId);
      if (requested) {
        state.selectedId = requested.id;
      }

      applyFilter();

      const initial =
        requested ||
        state.slides.find((slide) => slide.id === state.selectedId) ||
        state.filtered[0];
      if (initial) {
        selectSlide(initial.id);
      }
    }

    elements.search.addEventListener("input", applyFilter);
    elements.moduleFilter.addEventListener("change", applyFilter);
    elements.addSlide.addEventListener("click", addAdditionalSlide);
    elements.moveSlideUp.addEventListener("click", () => applySelectedSlideCuration("up"));
    elements.moveSlideDown.addEventListener("click", () => applySelectedSlideCuration("down"));
    elements.deleteSlide.addEventListener("click", () => {
      const slide = selectedSlide();
      if (!slide) return;
      applySelectedSlideCuration(slideIsHidden(slide) ? "restore" : "hide");
    });
    elements.undoDelete.addEventListener("click", restoreDeletedSlideFromToast);
    elements.showHiddenSlides.addEventListener("change", () => {
      state.showHidden = elements.showHiddenSlides.checked;
      applyFilter();
    });
    elements.previous.addEventListener("click", () => move(-1));
    elements.next.addEventListener("click", () => move(1));
    elements.presentationMode.addEventListener("click", openPresentationMode);
    elements.refresh.addEventListener("click", () => loadSlides(state.selectedId));
    elements.versionSelect.addEventListener("change", changeVersion);
    elements.runCrosscheck.addEventListener("click", runGlobalCrosscheck);
    elements.closeCrosscheck.addEventListener("click", closeGlobalCrosscheckPanel);
    elements.globalCrosscheckBackdrop.addEventListener("click", (event) => {
      if (event.target === elements.globalCrosscheckBackdrop) closeGlobalCrosscheckPanel();
    });
    elements.saveReview.addEventListener("click", saveReview);
    elements.includeInPresentation.addEventListener("change", savePresentationPreference);
    elements.svgFullscreen.addEventListener("click", openFullscreenViewer);
    elements.svgAnimationEdit.addEventListener("click", () => {
      const slide = selectedSlide();
      if (!slide || !activeSvgProposal(slide) || state.selectedVersionId !== "current") return;
      location.href = `/svg-animation-editor?id=${encodeURIComponent(slide.id)}`;
    });
    elements.animationPlay.addEventListener("click", playAnimation);
    elements.animationReset.addEventListener("click", resetAnimationPreview);
    elements.fullscreenPlay.addEventListener("click", playAnimation);
    elements.fullscreenReset.addEventListener("click", resetAnimationPreview);
    elements.fullscreenClose.addEventListener("click", closeFullscreenViewer);
    elements.fullscreenPreviousSlide.addEventListener("click", () => movePresentation(-1));
    elements.fullscreenNextSlide.addEventListener("click", () => movePresentation(1));
    elements.fullscreenSvgFrame.addEventListener("click", () => movePresentation(1));
    elements.animationDelay.addEventListener("change", () => {
      handleAnimationDelayChange(elements.animationDelay.value);
    });
    elements.fullscreenDelay.addEventListener("change", () => {
      handleAnimationDelayChange(elements.fullscreenDelay.value);
    });
    elements.animationTimeline.addEventListener("input", () => {
      if (!state.animationManifest) return;
      stopAnimationPlayback();
      renderAnimationAt(Number(elements.animationTimeline.value));
    });
    elements.fullscreenTimeline.addEventListener("input", () => {
      if (!state.animationManifest) return;
      stopAnimationPlayback();
      renderAnimationAt(Number(elements.fullscreenTimeline.value));
    });
    elements.fitMode.addEventListener("change", () => {
      state.fit = elements.fitMode.value;
      const slide = selectedSlide();
      if (slide) renderMedia(slide);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !elements.globalCrosscheckBackdrop.hidden) {
        closeGlobalCrosscheckPanel();
        return;
      }
      if (event.key === "Escape" && state.fullscreenOpen) {
        closeFullscreenViewer();
        return;
      }
      if (event.target.matches("input, select, textarea")) return;
      if (state.fullscreenOpen && state.fullscreenMode === "presentation") {
        if (event.target.closest("button, a")) return;
        if (event.key === "ArrowLeft" || event.key === "PageUp" || event.key.toLowerCase() === "a") {
          event.preventDefault();
          movePresentation(-1);
          return;
        }
        if (event.key === " ") {
          event.preventDefault();
          if (state.animationManifest?.steps?.length && state.animationSvg) {
            playAnimation();
          } else {
            movePresentation(1);
          }
          return;
        }
        if (
          event.key === "ArrowRight" ||
          event.key === "PageDown" ||
          event.key === "Enter" ||
          event.key.toLowerCase() === "d"
        ) {
          event.preventDefault();
          movePresentation(1);
          return;
        }
        return;
      }
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") move(-1);
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") move(1);
      if (event.key === "/") {
        event.preventDefault();
        elements.search.focus();
      }
    });
    document.addEventListener("fullscreenchange", () => {
      if (state.fullscreenOpen && !document.fullscreenElement) {
        closeFullscreenViewer();
      }
    });

    loadSlides().catch((error) => {
      elements.count.textContent = `Fehler: ${error.message}`;
    });
  </script>
</body>
</html>
